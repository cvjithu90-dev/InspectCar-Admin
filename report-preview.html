<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>InspectCar — Vehicle Inspection Report PDF</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
@page { margin: 0; size: A4; }
* { box-sizing: border-box; }
body {
  font-family: 'Helvetica Neue', Arial, sans-serif;
  color: #241D33;
  margin: 0;
  padding: 0;
  font-size: 12px;
  background: #0f0f1b;
}

/* Floating Action Bar (hidden on print) */
.action-bar {
  position: fixed;
  top: 16px;
  right: 24px;
  z-index: 9999;
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(22, 22, 37, 0.92);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(139, 92, 246, 0.4);
  padding: 10px 18px;
  border-radius: 30px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
.action-bar button {
  background: linear-gradient(135deg, #7C3AED, #6366F1);
  color: #fff;
  border: none;
  padding: 8px 16px;
  border-radius: 20px;
  font-weight: 700;
  font-size: 12px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
  transition: transform 0.15s, opacity 0.15s;
}
.action-bar button:hover {
  transform: translateY(-1px);
  opacity: 0.95;
}
.action-bar .status-pill {
  font-size: 11px;
  color: #34d399;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
}
.action-bar .status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #10b981;
  box-shadow: 0 0 8px #10b981;
}

.report-container {
  max-width: 210mm;
  margin: 20px auto;
  background: #ffffff;
  box-shadow: 0 15px 40px rgba(0,0,0,0.4);
}

@media print {
  body { background: #ffffff !important; }
  .no-print { display: none !important; }
  .report-container { max-width: 100% !important; margin: 0 !important; box-shadow: none !important; }
  .page { page-break-after: always; }
  .page:last-child { page-break-after: avoid; }
}

.page {
  width: 100%;
  min-height: 297mm;
  padding: 16mm 14mm 18mm 14mm;
  position: relative;
  box-sizing: border-box;
  background: #ffffff;
}

/* Cover Page */
.cover {
  padding: 0;
  background: linear-gradient(160deg, #150C29 0%, #241147 55%, #3B1670 100%);
  color: #fff;
  height: 297mm;
  position: relative;
  overflow: hidden;
}
.cover-glow {
  position: absolute; top: -120px; right: -120px; width: 420px; height: 420px;
  background: radial-gradient(circle, rgba(167,139,250,0.55) 0%, rgba(124,58,237,0) 70%);
}
.cover-glow2 {
  position: absolute; bottom: -160px; left: -100px; width: 480px; height: 480px;
  background: radial-gradient(circle, rgba(124,58,237,0.35) 0%, rgba(124,58,237,0) 70%);
}
.cover-inner { position: relative; padding: 20mm 16mm; height: 100%; }
.cover-logo { height: 38px; margin-bottom: 40px; font-size: 24px; font-weight: 900; color: #fff; display: flex; align-items: center; gap: 8px; }
.cover-logo span { color: #A78BFA; }
.cover-tag {
  display: inline-block;
  border: 1px solid rgba(255,255,255,0.35);
  color: #C9B6FF;
  font-size: 10px;
  letter-spacing: 2px;
  padding: 5px 12px;
  border-radius: 20px;
  margin-bottom: 18px;
  text-transform: uppercase;
}
.cover-title {
  font-size: 38px;
  font-weight: 800;
  line-height: 1.15;
  margin: 0 0 10px 0;
  max-width: 480px;
}
.cover-title span { color: #B49BFF; }
.cover-sub {
  font-size: 13px;
  color: #D9CFFF;
  max-width: 440px;
  line-height: 1.6;
  margin-bottom: 35px;
}
.cover-scorewrap {
  display: flex;
  align-items: center;
  gap: 18px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 16px;
  padding: 18px 22px;
  max-width: 440px;
  margin-bottom: 40px;
}
.cover-score-num { font-size: 34px; font-weight: 800; color: #fff; }
.cover-score-label { font-size: 10px; color: #C9B6FF; text-transform: uppercase; letter-spacing: 1px; }
.cover-verdict { font-size: 14px; font-weight: 700; color: #4ADE80; margin-top: 2px; }
.cover-meta {
  position: absolute;
  bottom: 20mm;
  left: 16mm;
  right: 16mm;
  display: flex;
  justify-content: space-between;
  border-top: 1px solid rgba(255,255,255,0.2);
  padding-top: 16px;
}
.cover-meta-item { font-size: 10.5px; color: #D9CFFF; }
.cover-meta-item b { display: block; color: #fff; font-size: 12.5px; margin-top: 2px; }
.cover-contact {
  position: absolute; top: 20mm; right: 16mm; text-align: right; font-size: 10.5px; color: #D9CFFF;
}
.cover-contact b { color: #fff; display:block; font-size: 12px; }

/* Header & Footer */
.hdr {
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 2px solid #EFE8FF;
  padding-bottom: 10px;
  margin-bottom: 18px;
}
.hdr-word { font-size: 17px; font-weight: 800; }
.hdr-word .i { color: #241D33; }
.hdr-word .c { color: #7C3AED; }
.hdr-right { font-size: 9.5px; color: #8A8296; text-align: right; }
.footer {
  position: absolute; bottom: 8mm; left: 14mm; right: 14mm;
  display: flex; justify-content: space-between;
  font-size: 8.5px; color: #A79DBE; border-top: 1px solid #EEE7FB; padding-top: 6px;
}

.section-title { font-size: 16px; font-weight: 800; color: #1E1730; margin: 4px 0 4px 0; }
.section-sub { font-size: 10px; color: #8A8296; margin-bottom: 14px; }
.pill-purple {
  display:inline-block; background:#EFE6FF; color:#6D28D9; font-size:9.5px; font-weight:700;
  padding: 3px 10px; border-radius: 20px; letter-spacing:0.5px; text-transform:uppercase;
}

/* Score row */
.score-row { display:flex; gap: 16px; margin-bottom: 18px; }
.score-card {
  flex: 0 0 160px;
  background: linear-gradient(160deg,#2B1657,#4C1D95);
  border-radius: 16px; color:#fff; padding: 18px;
  text-align:center;
}
.score-big { font-size: 34px; font-weight: 800; }
.score-of { font-size: 10px; color:#D9CFFF; }
.score-verdict-badge {
  margin-top:10px; display:inline-block; background:rgba(74,222,128,0.18);
  color:#4ADE80; font-size:10px; font-weight:700; padding:4px 10px; border-radius:12px;
}
.grid2 { display:flex; flex-wrap:wrap; gap: 10px; flex: 1; }
.mini-card {
  width: calc(33.3% - 7px);
  background:#FAF8FF; border:1px solid #EFE6FF; border-radius:10px; padding:9px 11px;
}
.mini-card .k { font-size:9px; color:#8A8296; text-transform:uppercase; letter-spacing:0.5px; }
.mini-card .v { font-size:11.5px; font-weight:700; color:#241D33; margin-top:2px; }

/* Category Breakdown */
.subhead { font-size: 12px; font-weight:800; color:#4C1D95; margin: 16px 0 8px 0; text-transform: uppercase; letter-spacing: 0.5px; }
.cat-grid { display:flex; flex-wrap:wrap; gap: 10px; }
.cat-card {
  width: calc(50% - 5px);
  border:1px solid #EEE7FB; border-radius:12px; padding:12px 14px; margin-bottom:0;
  background:#fff;
}
.cat-card h4 {
  margin:0 0 6px 0; font-size:11.5px; font-weight:800; color:#1E1730;
  display:flex; align-items:center; gap:6px;
}
.dot { width:7px; height:7px; border-radius:50%; display:inline-block; }
.dot-g { background:#22C55E; } .dot-a { background:#F59E0B; } .dot-r { background:#EF4444; }
.cat-card p { margin:0; font-size:10px; line-height:1.55; color:#514A63; }

/* Negotiation */
.neg-card {
  border-left: 4px solid #7C3AED; background:#FAF8FF; border-radius:8px;
  padding: 10px 14px; margin-bottom: 10px; display:flex; justify-content:space-between; gap:14px;
}
.neg-left { flex:1; }
.neg-left .issue { font-weight:700; font-size:10.5px; color:#1E1730; margin-bottom:3px; }
.neg-left .desc { font-size:9.5px; color:#5A5268; line-height:1.5; }
.neg-right { flex:0 0 100px; text-align:right; }
.neg-amt { font-size: 15px; font-weight:800; color:#7C3AED; }
.neg-amt-label { font-size: 8px; color:#8A8296; text-transform:uppercase; }
.neg-total {
  background:#1E1035; color:#fff; border-radius:10px; padding: 12px 16px;
  display:flex; justify-content:space-between; align-items:center; margin-top: 10px;
}
.neg-total .t1 { font-size:11px; color:#D9CFFF; }
.neg-total .t2 { font-size:20px; font-weight:800; }

/* Info Grid */
.info-grid { display:flex; flex-wrap:wrap; gap: 0 24px; }
.info-col { flex: 1; min-width: 45%; }
.info-row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed #EDE6FA; font-size:10px; }
.info-row .k { color:#8A8296; }
.info-row .v { color:#241D33; font-weight:600; text-align:right; }
.redact { color:#8A8296; font-style: italic; }

/* Tables */
table.est { width:100%; border-collapse: collapse; margin-bottom: 12px; font-size: 10px; }
table.est th { background:#4C1D95; color:#fff; text-align:left; padding:7px 10px; font-size:9.5px; text-transform:uppercase; }
table.est td { padding:6px 10px; border-bottom:1px solid #F0EAFA; }
table.est tr:nth-child(even) td { background:#FBF9FF; }
table.est tr.cat-total td { font-weight:800; background:#F3EEFF; color:#4C1D95; }
.grand-total-box {
  background: linear-gradient(160deg,#2B1657,#4C1D95); color:#fff; border-radius:12px;
  padding:14px 18px; display:flex; justify-content:space-between; align-items:center; margin-top:6px;
}
.grand-total-box .g1 { font-size:11px; color:#D9CFFF; }
.grand-total-box .g2 { font-size:24px; font-weight:800; }

table.svc { width:100%; border-collapse:collapse; font-size:9.5px; }
table.svc th { background:#EFE6FF; color:#4C1D95; text-align:left; padding:6px 8px; }
table.svc td { padding:5px 8px; border-bottom:1px solid #F3EEFF; }
table.svc tr:nth-child(even) td { background:#FBF9FF; }

/* Checkpoint Sections */
.cp-section { margin-bottom: 12px; }
.cp-title {
  background:#1E1035; color:#fff; padding: 8px 12px; border-radius: 8px 8px 0 0;
  font-size:11.5px; font-weight:800; display:flex; justify-content:space-between;
}
.cp-title span.n { color:#B49BFF; font-weight:600; font-size:9.5px; }
table.cp { width:100%; border-collapse:collapse; font-size:9.5px; border:1px solid #EEE7FB; border-top:none; }
table.cp th { background:#FAF8FF; text-align:left; padding:6px 9px; color:#6D28D9; font-size:9px; text-transform:uppercase; }
table.cp td { padding:6px 9px; border-top:1px solid #F3EEFF; vertical-align: top; }
table.cp td.ans { font-weight:700; color:#1E1730; white-space: nowrap;}
table.cp td.note { color:#8A8296; }
.cp-photos { display:flex; gap:6px; padding: 6px 9px 8px 9px; flex-wrap:wrap; background: #FAF8FF; border:1px solid #EEE7FB; border-top:none; }
.cp-photos img { width: 85px; height: 62px; object-fit: cover; border-radius:6px; border:1px solid #EEE7FB; }
.doc-chip {
  height: 62px; padding: 0 10px; border-radius:6px; border:1px dashed #A78BFA; background:#F3EEFF;
  display:inline-flex; align-items:center; gap:6px; color:#6D28D9; font-size:10px; font-weight:700;
}

/* Gallery 4 */
.gallery4 { display:flex; gap:8px; margin-bottom: 14px; }
.gallery4 .g-item { flex:1; }
.gallery4 img { width:100%; height: 110px; object-fit:cover; border-radius:10px; border:1px solid #EEE7FB; }
.gallery4 .cap { font-size:8.5px; color:#8A8296; text-align:center; margin-top:3px; }

/* Back Cover */
.back {
  background: linear-gradient(160deg, #150C29 0%, #241147 55%, #3B1670 100%);
  color:#fff; height: 297mm; padding: 0; text-align:center;
}
.back-inner { padding-top: 100mm; }
.back h3 { font-size: 24px; margin: 0 0 8px 0; color: #fff; }
.back p { color:#D9CFFF; font-size:12px; max-width:400px; margin: 0 auto 26px auto; line-height:1.6; }
.back-btn {
  display:inline-block; background:#7C3AED; color:#fff; font-weight:700; font-size:12px;
  padding:12px 28px; border-radius: 24px; margin-bottom: 30px; text-decoration:none;
}
.back-contacts { font-size:11px; color:#C9B6FF; line-height:1.8; }
</style>
</head>
<body>

<div class="action-bar no-print">

function renderReportHTML(data) {
    const totalCut = (data.negotiations || []).reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
    const grandRepair = (data.repairs || []).reduce((sum, item) => sum + (Number(item.cost) || 0), 0);

    let html = `
    <!-- PAGE 1: COVER -->
    <div class="page cover">
      <div class="cover-glow"></div>
      <div class="cover-glow2"></div>

          <div class="cover-meta-item">Inspection Date<b>${data.inspectionDate || 'Today'}</b></div>
          <div class="cover-meta-item">Location<b>${data.location || 'Bengaluru'}</b></div>
        </div>
      </div>
    </div>

    <!-- PAGE 2: SUMMARY & BREAKDOWN -->
    <div class="page">

        <div class="grid2">
          <div class="mini-card"><div class="k">Vehicle</div><div class="v">${data.vehicle || 'N/A'}</div></div>
          <div class="mini-card"><div class="k">Reg Number</div><div class="v">${data.regNo || 'N/A'}</div></div>

          <div class="mini-card"><div class="k">Owner Count</div><div class="v">${data.ownerCount || '1st Owner'}</div></div>

        }).join('')}

    </div>

    <!-- PAGE 3: NEGOTIATION & ANOMALIES -->

      </div>

      <div class="pill-purple">Negotiation Tips</div>
      <div class="section-title">AI Price Negotiation Suggestions</div>
      <div class="section-sub">Quantified price deduction recommendations based on physical and mechanical defects found.</div>

      ${(data.negotiations || []).map(n => `
        <div class="neg-card">
          <div class="neg-left">
            <div class="issue">${n.issue}</div>
            <div class="desc">${n.desc || ''}</div>
          </div>
          <div class="neg-right"><div class="neg-amt">₹${Number(n.amount).toLocaleString('en-IN')}</div><div class="neg-amt-label">Suggested Cut</div></div>
        </div>
      `).join('')}

      <div class="neg-total">
        <div><div class="t1">Total Suggested Room for Price Negotiation</div></div>
        <div class="t2">₹${totalCut.toLocaleString('en-IN')}</div>
      </div>

      <div class="subhead" style="margin-top:20px;">Verification &amp; Anomaly Checks</div>
      <div class="cat-grid">
        <div class="cat-card"><h4><span class="dot dot-g"></span>Insurance Status</h4><p>Active and verified on file.</p></div>
        <div class="cat-card"><h4><span class="dot dot-g"></span>Chassis &amp; VIN Check</h4><p>VIN plate matches engine block and RC records cleanly.</p></div>
        <div class="cat-card"><h4><span class="dot dot-g"></span>Ownership Verification</h4><p>Verified ${data.ownerCount || 'First Owner'} registration.</p></div>
        <div class="cat-card"><h4><span class="dot dot-g"></span>RTO Tax &amp; Fitness</h4><p>Road tax and fitness clear.</p></div>
      </div>

      <div class="footer">
        <div>InspectCar &middot; AI Vehicle Inspection Report &middot; inspectcar.in</div>
        <div>Page 3</div>
      </div>
    </div>

    <!-- PAGE 4: REPAIR ESTIMATE & SERVICE HISTORY -->
    <div class="page">
      <div class="hdr">
        <div class="hdr-word"><span class="i">Inspect</span><span class="c">Car</span></div>
        <div class="hdr-right">Repair Estimates &amp; Service History</div>
      </div>

      <div class="pill-purple">Repair Estimate</div>
      <div class="section-title">Estimated Repair &amp; Refurbishment Costs</div>
      <div class="section-sub">Itemized estimate of required repairs flagged during inspection.</div>

      <table class="est">
        <thead><tr><th>Item / Repair Task</th><th style="text-align:right;">Category</th><th style="text-align:right;">Estimated Cost</th></tr></thead>
        <tbody>
          ${(data.repairs || []).map(r => `
            <tr><td>${r.item}</td><td style="text-align:right; color:#6D28D9;">${r.category || 'General'}</td><td style="text-align:right; font-weight:700;">₹${Number(r.cost).toLocaleString('en-IN')}</td></tr>
          `).join('')}
        </tbody>
      </table>

      <div class="grand-total-box">
        <div class="g1">Grand Total Estimated Repair Cost</div>
        <div class="g2">₹${grandRepair.toLocaleString('en-IN')}</div>
      </div>

      <div class="subhead" style="margin-top:24px;">Service History Log</div>
      <table class="svc">
        <thead><tr><th>Date</th><th>Authorized Dealer</th><th>Odometer</th><th>Amount Paid</th></tr></thead>
        <tbody>
          ${(data.services && data.services.length > 0) ? data.services.map(s => `
            <tr><td>${s.date}</td><td>${s.dealer}</td><td>${s.odo}</td><td>${s.amount}</td></tr>
          `).join('') : `<tr><td colspan="4" style="text-align:center; color:#8A8296;">No service records attached</td></tr>`}
        </tbody>
      </table>

      ${(data.documents && data.documents.length > 0) ? `
        <div class="subhead" style="margin-top:16px;">Attached Documents &amp; Files</div>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
            ${data.documents.map(doc => `
                <div class="doc-chip">📄 ${doc.name || 'Uploaded File'} (${doc.type || 'Document'})</div>
            `).join('')}
        </div>
      ` : ''}

      <div class="footer">
        <div>InspectCar &middot; AI Vehicle Inspection Report &middot; inspectcar.in</div>
        <div>Page 4</div>
      </div>
    </div>

    <!-- PAGE 5: INSPECTION PHOTOS & CHECKLIST -->
    <div class="page">
      <div class="hdr">
        <div class="hdr-word"><span class="i">Inspect</span><span class="c">Car</span></div>
        <div class="hdr-right">Inspection Photos &amp; Checkpoints</div>
      </div>

      <div class="pill-purple">Vehicle Gallery</div>
      <div class="section-title">Baseline Photos</div>

      <div class="gallery4">
        <div class="g-item"><img src="${data.photos?.front || 'https://images.unsplash.com/photo-1549399542-7e3f8b79c341?w=600&auto=format&fit=crop&q=60'}"/><div class="cap">Front View</div></div>
        <div class="g-item"><img src="${data.photos?.side || 'https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=600&auto=format&fit=crop&q=60'}"/><div class="cap">Side Profile</div></div>
        <div class="g-item"><img src="${data.photos?.rear || 'https://images.unsplash.com/photo-1617814076367-b759c7d7e738?w=600&auto=format&fit=crop&q=60'}"/><div class="cap">Rear Profile</div></div>
        <div class="g-item"><img src="${data.photos?.interior || 'https://images.unsplash.com/photo-1563720223185-11003d516935?w=600&auto=format&fit=crop&q=60'}"/><div class="cap">Interior Cabin</div></div>
      </div>

      ${(data.checklist && data.checklist.length > 0) ? `
        <div class="cp-section">
          <div class="cp-title">Inspector Checkpoint Findings <span class="n">${data.checklist.length} items</span></div>
          <table class="cp">
            <thead><tr><th>Category &amp; Item</th><th>Status</th><th>Inspector Notes</th></tr></thead>
            <tbody>
              ${data.checklist.slice(0, 15).map(c => `
                <tr><td><b>${c.category}</b> — ${c.item_name}</td><td class="ans">${c.status}</td><td class="note">${c.note || '—'}</td></tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      ` : ''}

      <div class="footer">
        <div>InspectCar &middot; AI Vehicle Inspection Report &middot; inspectcar.in</div>
        <div>Page 5</div>
      </div>
    </div>

    <!-- PAGE 6: BACK COVER -->
    <div class="page back">
      <div class="back-inner">
        <div style="font-size:32px; font-weight:900; color:#fff; margin-bottom:12px;"><span>Inspect</span><span style="color:#A78BFA;">Car</span></div>
        <h3>Confidential Inspection Report</h3>
        <p>This report has been generated for <b>${data.customerName || 'Customer'}</b> for reference in pre-purchase evaluation of <b>${data.vehicle || 'Vehicle'}</b>.</p>
        <a href="https://inspectcar.in" target="_blank" class="back-btn">Visit InspectCar.in</a>
        <div class="back-contacts">
          Helpline &amp; Support: +91 99003 68006 &middot; support@inspectcar.in<br/>
          Copyright &copy; 2026 InspectCar Technologies. All Rights Reserved.
        </div>
      </div>
    </div>
    `;

    document.getElementById('report-output').innerHTML = html;
}

function loadReportData() {
    const data = getReportData();
    renderReportHTML(data);
}

// Live Sync listeners
window.addEventListener('storage', (e) => {
    if (e.key === 'inspectcar_active_report') {
        loadReportData();
    }
});

if ('BroadcastChannel' in window) {
    const bc = new BroadcastChannel('inspectcar_report_channel');
    bc.onmessage = (event) => {
        if (event.data && event.data.type === 'SYNC_REPORT') {
            renderReportHTML(event.data.report);
        }
    };
}

// Initial render
loadReportData();
</script>
</body>
</html>
