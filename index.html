                let session = null;
                if (dbClient && dbClient.auth) {
                    try {
                        const { data } = await dbClient.auth.getSession();
                        session = data ? data.session : null;
                    } catch (e) {
                        console.warn("Auth getSession error:", e);
                    }
                }
                
                const isAuthenticated = Boolean(session || state.user);
                
                if (!isAuthenticated) {
                    if (window.location.hash !== '#/login') {
                        window.location.hash = '#/login';
                    }
                    const appEl = $('#app');
                    const loginTpl = $('#view-login');
                    if (appEl && loginTpl && !document.getElementById('login-form')) {
                        appEl.innerHTML = loginTpl.innerHTML;
                    }
                    setupLoginForm();
                    return;
                }

                if (session) {
                    state.user = session.user;
                    state.profile = { id: session.user.id, full_name: session.user.user_metadata?.full_name || 'Admin', role: 'admin' };
                }

                if (isAuthenticated && (path === '#/login' || path === '' || path === '#')) {
                    window.location.hash = '#/dashboard';
                    path = '#/dashboard';
                }

                if (isAuthenticated && !document.querySelector('.sidebar')) {
                    const appEl = $('#app');
                    const shellTpl = $('#app-shell');
                    if (appEl && shellTpl) {
                        appEl.innerHTML = shellTpl.innerHTML;
                        updateHeader();
                        setupShellEvents();
                        setupRealtime();
                    }
                }

                let viewTemplateId = 'view-dashboard';
                let renderLogic = renderDashboard;

                if (path === '#/dashboard') {
                    viewTemplateId = 'view-dashboard';
                    renderLogic = renderDashboard;
                } else if (path === '#/bookings') {
                    viewTemplateId = 'view-bookings';
                    renderLogic = renderBookings;
                } else if (path.startsWith('#/booking/')) {
                    state.currentBookingId = path.split('/')[2];
                    viewTemplateId = 'view-booking-detail';
                    renderLogic = renderBookingDetail;
                } else if (path === '#/new-booking') {
                    viewTemplateId = 'view-new-booking';
                    renderLogic = renderNewBooking;
                } else if (path === '#/inspectors') {
                    viewTemplateId = 'view-inspectors';
                    renderLogic = renderInspectors;
                } else if (path === '#/analytics') {
                    viewTemplateId = 'view-analytics';
                    renderLogic = renderAnalytics;
                } else if (path === '#/database') {
                    viewTemplateId = 'view-database';
                    renderLogic = renderDatabase;
                }

                const pageContainer = $('#page-container');
                const viewTpl = $(`#${viewTemplateId}`);
                if (pageContainer && viewTpl) {
                    pageContainer.innerHTML = viewTpl.innerHTML;
                    updateNavActiveState(path);
                    if (typeof renderLogic === 'function') {
                        try {
                            await renderLogic();
                        } catch(renderErr) {
                            console.error("Render error in view:", renderErr);
                        }
                    }
                }
            } catch (err) {
                console.error("Router error:", err);
            }
        }

        window.addEventListener('hashchange', router);
        window.addEventListener('load', router);

        // ==========================================
        // Core Setup
        // ==========================================
        function updateHeader() {
            const today = new Date();
            const dateString = today.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            if($('#header-date')) $('#header-date').textContent = dateString;
            if($('#header-greeting') && state.profile) $('#header-greeting').textContent = `Good Morning, ${state.profile.full_name.split(' ')[0]}`;
        }

        function updateNavActiveState(currentPath) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            const activeEl = document.querySelector(`.nav-item[data-path="${currentPath.replace('#', '')}"]`);
            if (activeEl) activeEl.classList.add('active');
        }

        function setupShellEvents() {
            $('#logout-btn')?.addEventListener('click', async (e) => {
                e.preventDefault();
                if (dbClient && dbClient.auth) await dbClient.auth.signOut();
                state = { user: null, profile: null };
                if (realtimeSubscription && dbClient) dbClient.removeChannel(realtimeSubscription);
                window.location.hash = '#/login';
                router();
            });
        }

        function setupRealtime() {
            if (realtimeSubscription || !dbClient) return;
            realtimeSubscription = dbClient.channel('public:bookings')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'bookings' }, payload => {
                    showToast(`New booking received: ${payload.new.booking_ref}`, 'success');
                    if (window.location.hash === '#/dashboard') renderDashboard();
                    if (window.location.hash === '#/bookings') renderBookings();
                })
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'bookings' }, payload => {
                    if (window.location.hash === '#/dashboard') renderDashboard();
                    if (window.location.hash === '#/bookings') renderBookings();
                })
                .subscribe();
        }

        // ==========================================
        // View Renderers & Logic
        // ==========================================

        // --- LOGIN ---
        window.handleSignIn = async function(e) {
            if (e) e.preventDefault();
            
            const emailInput = document.getElementById('login-email');
            const passwordInput = document.getElementById('login-password');
            const errDiv = document.getElementById('login-error');
            const submitBtn = document.getElementById('btn-login-submit');

            const email = emailInput ? emailInput.value.trim() : '';
            const password = passwordInput ? passwordInput.value : '';

            if (!email || !password) {
                if (errDiv) errDiv.textContent = 'Please enter both email and password';
                return;
            }

            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.textContent = 'Signing in...';
            }
            if (errDiv) errDiv.textContent = 'Authenticating...';

            try {
                if (!dbClient && window.supabase && window.supabase.createClient) {
                    dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                }

                const { data, error } = await dbClient.auth.signInWithPassword({ email, password });
                if (error) {
                    console.error("Sign in error:", error);
                    if (errDiv) errDiv.textContent = error.message;
                    showToast(error.message, 'error');
                } else if (data && data.session) {
                    state.user = data.session.user;
                    state.profile = { id: data.session.user.id, full_name: 'Admin', role: 'admin' };

                    if (errDiv) errDiv.textContent = 'Success! Opening dashboard...';
                    showToast('Sign in successful!', 'success');
                    window.location.hash = '#/dashboard';
                    await router();
                }
            } catch(err) {
                console.error("Sign in catch:", err);
                if (errDiv) errDiv.textContent = err.message || 'Error signing in.';
                showToast(err.message || 'Sign in error', 'error');
            } finally {
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Sign In';
                }
            }
        };

        function setupLoginForm() {
            const form = document.getElementById('login-form');
            if (form && !form._bound) {
                form._bound = true;
                form.onsubmit = function(e) {
                    e.preventDefault();
                    window.handleSignIn(e);
                };
            }
        }

        // --- DASHBOARD ---
        async function renderDashboard() {
            const client = dbClient || window.supabase;
            if(!client) return;

            // Fetch Stats
            const { count: totalBookings } = await client.from('bookings').select('*', { count: 'exact', head: true });
            
            const today = new Date().toISOString().split('T')[0];
            const { count: todayBookings } = await client.from('bookings').select('*', { count: 'exact', head: true }).gte('created_at', today);
            
            const { count: pendingBookings } = await client.from('bookings').select('*', { count: 'exact', head: true }).eq('status', 'pending');
            
            // Monthly revenue
            const firstDay = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString();
            const { data: revData } = await client.from('bookings').select('total_price').gte('created_at', firstDay).neq('status', 'cancelled');
            const totalRev = revData ? revData.reduce((sum, b) => sum + (Number(b.total_price) || 0), 0) : 0;

            if($('#dash-total-bookings')) $('#dash-total-bookings').textContent = totalBookings || 0;
            if($('#dash-today-bookings')) $('#dash-today-bookings').textContent = todayBookings || 0;
            if($('#dash-pending-bookings')) $('#dash-pending-bookings').textContent = pendingBookings || 0;
            if($('#dash-revenue')) $('#dash-revenue').textContent = formatCurrency(totalRev);

            // Live Feed
            const { data: recent } = await client.from('bookings').select('*').order('created_at', { ascending: false }).limit(5);
            const feedContainer = $('#live-feed');
            if(feedContainer) {
                feedContainer.innerHTML = '';
                if(recent && recent.length > 0) {
                    recent.forEach(b => {
                        feedContainer.innerHTML += `
                            <div class="flex justify-between items-center py-3 border-b" style="border-color: var(--border-color);">
                                <div>
                                    <div class="font-bold">${b.customer_name}</div>
                                    <div class="text-xs text-secondary">${b.vehicle_brand} ${b.vehicle_model} • ${formatDate(b.inspection_date)}</div>
                                </div>
                                <span class="badge badge-${b.status}">${b.status.replace('_', ' ')}</span>
                            </div>
                        `;
                    });
                } else {
                    feedContainer.innerHTML = '<p class="text-secondary text-sm">No recent bookings</p>';
                }
            }

            // Pipeline
            const { data: statusCounts } = await client.from('bookings').select('status');
            const counts = { pending: 0, assigned: 0, in_progress: 0, completed: 0, cancelled: 0 };
            if(statusCounts) statusCounts.forEach(b => counts[b.status]++);
            
            if($('#pipe-pending')) $('#pipe-pending').textContent = counts.pending;
            if($('#pipe-assigned')) $('#pipe-assigned').textContent = counts.assigned;
            if($('#pipe-inprogress')) $('#pipe-inprogress').textContent = counts.in_progress;
            if($('#pipe-completed')) $('#pipe-completed').textContent = counts.completed;
        }

        // --- BOOKINGS LIST ---
        async function renderBookings() {
             const tbody = $('#bookings-table-body');
             const statusFilter = $('#bookings-status-filter');
             const searchInput = $('#bookings-search');

             async function loadData() {
                 const client = dbClient || window.supabase;
                 if(!client) return;
                 let query = client.from('bookings').select('*, profiles(full_name)').order('created_at', { ascending: false }).limit(50);
                 
                 if(statusFilter.value) query = query.eq('status', statusFilter.value);
                 if(searchInput.value) {
                     const term = searchInput.value;
                     query = query.or(`booking_ref.ilike.%${term}%,customer_name.ilike.%${term}%,customer_phone.ilike.%${term}%`);
                 }

                 const { data, error } = await query;
                 tbody.innerHTML = '';
                 
                 if(error) {
                     tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger">Error loading data</td></tr>`;
                     return;
                 }

                 if(data.length === 0) {
                     tbody.innerHTML = `<tr><td colspan="7" class="text-center">No bookings found</td></tr>`;
                     return;
                 }

                 data.forEach(b => {
                     const inspectorName = b.profiles ? b.profiles.full_name : 'Unassigned';
                     tbody.innerHTML += `
                        <tr>
                            <td class="font-bold text-accent-light">${b.booking_ref}</td>
                            <td>
                                <div>${b.customer_name}</div>
                                <div class="text-xs text-secondary">${b.customer_phone}</div>
                            </td>
                            <td>${b.vehicle_brand} ${b.vehicle_model}</td>
                            <td>
                                <div>${formatDate(b.inspection_date)}</div>
                                <div class="text-xs text-secondary">${b.inspection_time}</div>
                            </td>
                            <td>${b.package_name}</td>
                            <td><span class="badge badge-${b.status}">${b.status.replace('_', ' ')}</span></td>
                            <td><a href="#/booking/${b.id}" class="btn btn-secondary text-sm">View</a></td>
                        </tr>
                     `;
                 });
             }

             loadData();
             statusFilter.addEventListener('change', loadData);
             
             let debounceTimeout;
             searchInput.addEventListener('input', () => {
                 clearTimeout(debounceTimeout);
                 debounceTimeout = setTimeout(loadData, 500);
             });
        }

        // --- BOOKING DETAIL ---
        async function fetchInspectors() {
             const client = dbClient || window.supabase;
             if(!client) return [];
             const { data } = await client.from('profiles').select('*').eq('role', 'inspector').eq('is_active', true);
             state.inspectors = data || [];
             return state.inspectors;
        }

        async function renderBookingDetail() {
            const client = dbClient || window.supabase;
            if(!client) return;

            const id = state.currentBookingId;
            const { data: b, error } = await client.from('bookings').select('*, profiles(full_name)').eq('id', id).single();
            
            if(error || !b) {
                showToast("Error loading booking details", "error");
                window.location.hash = '#/bookings';
                return;
            }

            // Populate UI
            $('#detail-ref').textContent = `Booking: ${b.booking_ref}`;
            $('#detail-status-badge').innerHTML = `<span class="badge badge-${b.status}">${b.status.replace('_', ' ')}</span>`;
            
            $('#detail-customer-name').textContent = b.customer_name || 'N/A';
            $('#detail-customer-phone').textContent = b.customer_phone || 'N/A';
            $('#detail-customer-email').textContent = b.customer_email || 'N/A';
            if($('#detail-area')) $('#detail-area').textContent = b.area || 'N/A';
            $('#detail-address').textContent = b.address || b.area;

            $('#detail-vehicle').textContent = `${b.vehicle_year || ''} ${b.vehicle_brand || ''} ${b.vehicle_model || ''} (${b.vehicle_fuel || 'Petrol'})`;
            $('#detail-reg').textContent = b.vehicle_reg || 'N/A';
            $('#detail-package').textContent = b.package_name;
            $('#detail-price').textContent = formatCurrency(b.total_price);
            $('#detail-datetime').textContent = `${formatDate(b.inspection_date)} at ${b.inspection_time}`;
            
            $('#detail-status-select').value = b.status;
            $('#detail-payment-select').value = b.payment_status || 'unpaid';
            $('#detail-notes').value = b.notes || '';

            // Pre-fill Customer Edit Inputs
            if($('#edit-customer-name')) $('#edit-customer-name').value = b.customer_name || '';
            if($('#edit-customer-phone')) $('#edit-customer-phone').value = b.customer_phone || '';
            if($('#edit-customer-email')) $('#edit-customer-email').value = b.customer_email || '';
            if($('#edit-area')) $('#edit-area').value = b.area || '';
            if($('#edit-address')) $('#edit-address').value = b.address || '';

            // Pre-fill Vehicle Edit Inputs
            if($('#edit-vehicle-brand')) $('#edit-vehicle-brand').value = b.vehicle_brand || '';
            if($('#edit-vehicle-model')) $('#edit-vehicle-model').value = b.vehicle_model || '';
            if($('#edit-vehicle-year')) $('#edit-vehicle-year').value = b.vehicle_year || '';
            if($('#edit-vehicle-reg')) $('#edit-vehicle-reg').value = b.vehicle_reg || '';

            // Customer Edit Event Handlers
            if($('#btn-edit-customer')) {
                $('#btn-edit-customer').onclick = () => {
                    $('#customer-view-mode').classList.add('hidden');
                    $('#customer-edit-mode').classList.remove('hidden');
                };
            }
            if($('#btn-cancel-edit-customer')) {
                $('#btn-cancel-edit-customer').onclick = () => {
                    $('#customer-edit-mode').classList.add('hidden');
                    $('#customer-view-mode').classList.remove('hidden');
                };
            }
            if($('#btn-save-customer')) {
                $('#btn-save-customer').onclick = async () => {
                    const cName = $('#edit-customer-name').value.trim();
                    const cPhone = $('#edit-customer-phone').value.trim();
                    const cEmail = $('#edit-customer-email').value.trim();
                    const cArea = $('#edit-area').value.trim();
                    const cAddr = $('#edit-address').value.trim();

                    if(!cName || !cPhone) {
                        showToast('Customer Name and Phone are required', 'error');
                        return;
                    }

                    const { error } = await client.from('bookings').update({
                        customer_name: cName,
                        customer_phone: cPhone,
                        customer_email: cEmail || null,
                        area: cArea,
                        address: cAddr
                    }).eq('id', id);

                    if(error) {
                        showToast(error.message, 'error');
                    } else {
                        showToast('Customer details saved successfully!', 'success');
                        renderBookingDetail();
                    }
                };
            }

            // Vehicle Edit Event Handlers
            if($('#btn-edit-vehicle')) {
                $('#btn-edit-vehicle').onclick = () => {
                    $('#vehicle-view-mode').classList.add('hidden');
                    $('#vehicle-edit-mode').classList.remove('hidden');
                };
            }
            if($('#btn-cancel-edit-vehicle')) {
                $('#btn-cancel-edit-vehicle').onclick = () => {
                    $('#vehicle-edit-mode').classList.add('hidden');
                    $('#vehicle-view-mode').classList.remove('hidden');
                };
            }
            if($('#btn-save-vehicle')) {
                $('#btn-save-vehicle').onclick = async () => {
                    const vBrand = $('#edit-vehicle-brand').value.trim();
                    const vModel = $('#edit-vehicle-model').value.trim();
                    const vYear = $('#edit-vehicle-year').value.trim();
                    const vReg = $('#edit-vehicle-reg').value.trim();

                    const { error } = await client.from('bookings').update({
                        vehicle_brand: vBrand,
                        vehicle_model: vModel,
                        vehicle_year: vYear,
                        vehicle_reg: vReg || null
                    }).eq('id', id);

                    if(error) {
                        showToast(error.message, 'error');
                    } else {
                        showToast('Vehicle details saved successfully!', 'success');
                        renderBookingDetail();
                    }
                };
            }

            // Parse Payment Details & Balance Breakdown
            const total = Number(b.total_price) || 0;
            let charged = 0;
            let razorpayRef = '';

            if (b.notes) {
                const chargedMatch = b.notes.match(/Charged:\s*₹?(\d+)/i);
                if (chargedMatch) charged = Number(chargedMatch[1]);

                const refMatch = b.notes.match(/Razorpay Ref:\s*([^\s|]+)/i);
                if (refMatch) razorpayRef = refMatch[1];
            }

            if (charged === 0) {
                if (b.payment_status === 'paid') charged = total;
                else if (b.payment_status === 'token_paid' || (b.payment_method && (b.payment_method.includes('199') || b.payment_method.includes('299')))) {
                    charged = b.payment_method && b.payment_method.includes('299') ? 299 : 199;
                }
            }

            const balance = Math.max(0, total - charged);
            const isFullyPaid = b.payment_status === 'paid' || balance === 0;

            if ($('#pay-total-amt')) $('#pay-total-amt').textContent = formatCurrency(total);
            if ($('#pay-advance-amt')) $('#pay-advance-amt').textContent = formatCurrency(charged);
            if ($('#pay-razorpay-ref')) {
                $('#pay-razorpay-ref').textContent = razorpayRef ? `Ref: ${razorpayRef}` : (charged > 0 ? 'Online Payment' : 'No online payment yet');
            }
            if ($('#pay-balance-amt')) $('#pay-balance-amt').textContent = formatCurrency(balance);
            if ($('#pay-balance-status')) {
                $('#pay-balance-status').textContent = isFullyPaid ? '✅ Fully Paid' : (charged > 0 ? '🟡 Balance Pending' : '⚠️ Unpaid Booking');
            }

            if ($('#detail-payment-badge')) {
                let badgeClass = 'badge-pending';
                let badgeText = 'Unpaid';
                if (isFullyPaid) {
                    badgeClass = 'badge-completed';
                    badgeText = 'Paid in Full';
                } else if (charged > 0) {
                    badgeClass = 'badge-assigned';
                    badgeText = `Token Paid (₹${charged})`;
                }
                $('#detail-payment-badge').innerHTML = `<span class="badge ${badgeClass}">${badgeText}</span>`;
            }

            // Generate Payment Link using inspectcar.in domain
            const clientWebsiteUrl = 'https://inspectcar.in/#pay-balance';
            const payBalanceUrl = `${clientWebsiteUrl}?ref=${b.booking_ref}&amt=${balance}&name=${encodeURIComponent(b.customer_name)}`;

            const waText = encodeURIComponent(
                `Hi ${b.customer_name}! 👋\n\n` +
                `Here are the payment details for your InspectCar inspection booking (*${b.booking_ref}*):\n\n` +
                `🚗 *Vehicle:* ${b.vehicle_brand} ${b.vehicle_model} (${b.vehicle_year})\n` +
                `📦 *Package Total:* ${formatCurrency(total)}\n` +
                `✅ *Advance Paid:* ${formatCurrency(charged)}\n` +
                `🟡 *Balance Due:* *${formatCurrency(balance)}*\n\n` +
                `Please complete your balance payment securely here:\n` +
                `${payBalanceUrl}`
            );
            const waPhone = (b.customer_phone || '').replace(/\D/g, '');
            const waFullUrl = `https://wa.me/91${waPhone.slice(-10)}?text=${waText}`;

            const btnAdminPay = $('#btn-admin-pay-now');
            if (btnAdminPay) {
                if (balance <= 0) {
                    btnAdminPay.style.display = 'none';
                } else {
                    btnAdminPay.style.display = 'inline-flex';
                    btnAdminPay.onclick = () => {
                        if (typeof Razorpay === 'undefined') {
                            alert('Razorpay Checkout SDK is loading. Please try again.');
                            return;
                        }
                        const RAZORPAY_KEY = window.RAZORPAY_KEY_ID || 'rzp_live_TJRDVu6qlB1ZbO';
                        const options = {
                            key: RAZORPAY_KEY,
                            amount: balance * 100,
                            currency: 'INR',
                            name: 'InspectCar',
                            description: `Balance Payment for Booking ${b.booking_ref}`,
                            image: 'images/Logo.webp',
                            prefill: {
                                name: b.customer_name || '',
                                email: b.customer_email || '',
                                contact: b.customer_phone || ''
                            },
                            theme: { color: '#6366f1' },
                            handler: async function (response) {
                                const paymentId = response.razorpay_payment_id;
                                const updatedNotes = (b.notes || '') + ` | Balance Paid online: ₹${balance} (Ref: ${paymentId})`;
                                const { error } = await client.from('bookings').update({
                                    payment_status: 'paid',
                                    notes: updatedNotes
                                }).eq('id', id);
                                if (!error) {
                                    showToast(`Balance payment of ₹${balance} verified via Razorpay!`, 'success');
                                    renderBookingDetail();
                                }
                            }
                        };
                        const rzp = new Razorpay(options);
                        rzp.open();
                    };
                }
            }

            const btnWaLink = $('#btn-whatsapp-payment-link');
            if (btnWaLink) {
                btnWaLink.onclick = () => {
                    window.open(waFullUrl, '_blank');
                };
            }

            const btnCopyLink = $('#btn-copy-payment-link');
            if (btnCopyLink) {
                btnCopyLink.onclick = () => {
                    navigator.clipboard.writeText(payBalanceUrl).then(() => {
                        showToast('Balance Payment Link copied to clipboard!', 'success');
                    }).catch(() => {
                        showToast(`Payment Link: ${payBalanceUrl}`, 'info');
                    });
                };
            }

            // Setup Inspectors Dropdown
            const inspectors = await fetchInspectors();
            const select = $('#detail-inspector-select');
            select.innerHTML = '<option value="">Select Inspector...</option>';
            inspectors.forEach(ins => {
                const opt = document.createElement('option');
                opt.value = ins.id;
                opt.textContent = ins.full_name;
                select.appendChild(opt);
            });
            if(b.inspector_id) select.value = b.inspector_id;

            // Events
            $('#btn-assign').onclick = async () => {
                const iid = select.value;
                if(!iid) {
                    showToast('Please select an inspector to assign', 'error');
                    return;
                }
                const { error } = await client.from('bookings').update({ 
                    inspector_id: iid, 
                    status: b.status === 'pending' ? 'assigned' : b.status 
                }).eq('id', id);
                
                if(error) showToast(error.message, 'error');
                else {
                    showToast('Inspector assigned successfully', 'success');
                    renderBookingDetail();
                }
            };

            $('#btn-save-notes').onclick = async () => {
                const notes = $('#detail-notes').value;
                const { error } = await client.from('bookings').update({ notes }).eq('id', id);
                if(!error) showToast('Notes saved', 'success');
            };

            $('#btn-delete').onclick = async () => {
                if(confirm('Are you sure you want to delete this booking? This cannot be undone.')) {
                    await client.from('bookings').delete().eq('id', id);
                    window.location.hash = '#/bookings';
                }
            };
        }

        window.updateBookingStatus = async function(status) {
            const client = dbClient || window.supabase;
            if(!state.currentBookingId || !client) return;
            const { error } = await client.from('bookings').update({ status }).eq('id', state.currentBookingId);
            if(!error) {
                showToast(`Status updated to ${status}`, 'success');
                renderBookingDetail();
            }
        }

        window.updatePaymentStatus = async function(payment_status) {
            const client = dbClient || window.supabase;
            if(!state.currentBookingId || !client) return;
            const { error } = await client.from('bookings').update({ payment_status }).eq('id', state.currentBookingId);
            if(!error) showToast(`Payment marked as ${payment_status}`, 'success');
        }

        // --- NEW BOOKING ---
        async function renderNewBooking() {
            const inspectors = await fetchInspectors();
            const select = $('#nb-inspector');
            select.innerHTML = '<option value="">-- Leave Pending --</option>';
            inspectors.forEach(ins => {
                select.innerHTML += `<option value="${ins.id}">${ins.full_name}</option>`;
            });

            $('#new-booking-form').onsubmit = async (e) => {
                e.preventDefault();
                const client = dbClient || window.supabase;
                if (!client) return;
                
                const pkg = $('#nb-package').value;
                let price = 2500;
                if(pkg.includes('Luxury')) price = 3599;
                if(pkg.includes('Quick')) price = 2000;

                const inspector_id = $('#nb-inspector').value || null;
                const status = inspector_id ? 'assigned' : 'pending';
                
                const yearStr = new Date().getFullYear().toString().slice(-2);
                const rand = Math.floor(1000 + Math.random() * 9000);
                const booking_ref = `IC-${yearStr}-${rand}`;

                const payload = {
                    booking_ref,
                    customer_name: $('#nb-name').value,
                    customer_phone: $('#nb-phone').value,
                    address: $('#nb-address').value,
                    vehicle_brand: $('#nb-vehicle').value.split(' ')[0],
                    vehicle_model: $('#nb-vehicle').value.split(' ').slice(1).join(' ') || '',
                    vehicle_year: $('#nb-year').value,
                    vehicle_reg: $('#nb-reg').value,
                    package_name: pkg,
                    base_price: price,
                    total_price: price,
                    inspection_date: $('#nb-date').value,
                    inspection_time: $('#nb-time').value,
                    status,
                    inspector_id
                };

                const { data, error } = await client.from('bookings').insert([payload]).select().single();
                if(error) {
                    showToast(error.message, 'error');
                } else {
                    showToast('Booking created successfully!', 'success');
                    window.location.hash = `#/booking/${data.id}`;
                }
            };
        }

        // --- INSPECTORS ---
        async function renderInspectors() {
            const client = dbClient || window.supabase;
            const grid = $('#inspectors-grid');
            if(!grid) return;

            grid.innerHTML = '<p class="text-secondary">Loading inspectors...</p>';

            if(!client) {
                grid.innerHTML = '<p class="text-danger">Supabase connection unavailable.</p>';
                return;
            }

            try {
                const { data, error } = await client.from('profiles').select('*').eq('role', 'inspector').order('full_name');
                
                if (error) {
                    console.error("Profiles error:", error);
                    grid.innerHTML = `<p class="text-danger">Error loading inspectors: ${error.message}</p>`;
                    return;
                }

                grid.innerHTML = '';
                if (data && data.length > 0) {
                    for (let ins of data) {
                        const { count: activeCount } = await client.from('bookings')
                            .select('*', { count: 'exact', head: true })
                            .eq('inspector_id', ins.id)
                            .in('status', ['assigned', 'in_progress']);

                        grid.innerHTML += `
                            <div class="card">
                                <div class="flex justify-between items-start mb-2">
                                    <h3 class="font-bold">${ins.full_name}</h3>
                                    <span class="badge ${ins.is_active ? 'badge-completed' : 'badge-cancelled'}">${ins.is_active ? 'Active' : 'Inactive'}</span>
                                </div>
                                <div class="text-secondary text-sm mb-3"><i class="fas fa-phone" style="margin-right:4px;"></i> ${ins.phone || 'N/A'}</div>
                                <div class="text-xs text-secondary mb-4">Active Jobs: <strong class="text-accent-light">${activeCount || 0}</strong></div>
                                
                                <div class="flex gap-2 border-t pt-3" style="border-color: var(--border-color); flex-wrap: wrap;">
                                    <button class="btn btn-secondary text-xs" style="padding: 0.25rem 0.5rem" onclick="openEditInspectorModal('${ins.id}', '${(ins.full_name || '').replace(/'/g, "\\'")}', '${(ins.phone || '').replace(/'/g, "\\'")}')"><i class="fas fa-key" style="margin-right:4px;"></i> Edit / Password</button>
                                    <button class="btn btn-secondary text-xs" style="padding: 0.25rem 0.5rem" onclick="toggleInspector('${ins.id}', ${!ins.is_active})">${ins.is_active ? 'Deactivate' : 'Activate'}</button>
                                    <button class="btn btn-danger text-xs" style="padding: 0.25rem 0.5rem; background: rgba(239,68,68,0.2); border: 1px solid var(--danger-color); color: #ef4444;" onclick="deleteInspector('${ins.id}', '${(ins.full_name || '').replace(/'/g, "\\'")}')"><i class="fas fa-trash-alt" style="margin-right:4px;"></i> Remove</button>
                                </div>
                            </div>
                        `;
                    }
                } else {
                    grid.innerHTML = '<p class="text-secondary">No inspectors found. Click "+ Add Inspector" above to create your first inspector.</p>';
                }
            } catch(e) {
                console.error("renderInspectors error:", e);
                grid.innerHTML = `<p class="text-danger">Error loading inspectors.</p>`;
            }

            // Setup Add Form
            const addForm = $('#add-inspector-form');
            if (addForm) {
                addForm.onsubmit = async (e) => {
                    e.preventDefault();
                    const name = $('#ai-name')?.value;
                    const phone = $('#ai-phone')?.value;
                    const email = $('#ai-email')?.value;
                    const password = $('#ai-password')?.value;

                    if(!name || !email || !password) {
                        showToast("Please fill all required fields", "error");
                        return;
                    }

                    if (email.toLowerCase().trim() === 'cvjithu90@gmail.com') {
                        showToast("cvjithu90@gmail.com is your Admin email! Please enter a unique email for the inspector (e.g. inspector1@inspectcar.in).", "error");
                        return;
                    }

                    showToast("Creating inspector account...", "info");

                    try {
                        // 1. Try Register in Auth
                        let userId = null;
                        const { data: authData, error: authError } = await client.auth.signUp({
                            email,
                            password,
                            options: { data: { full_name: name, role: 'inspector' } }
                        });

                        if (authData && authData.user && authData.user.id) {
                            userId = authData.user.id;
                        } else if (authError) {
                            console.warn("Auth signUp notice:", authError);
                        }

                        if (!userId) {
                            userId = (window.crypto && window.crypto.randomUUID) ? window.crypto.randomUUID() : '00000000-0000-4000-8000-' + Date.now().toString(16).padStart(12, '0');
                        }

                        // 2. Create in profiles table
                        const { error: profError } = await client.from('profiles').upsert({
                            id: userId,
                            full_name: name,
                            phone: phone || '',
                            role: 'inspector',
                            is_active: true
                        });

                        if (profError) {
                            console.error("Profile creation error:", profError);
                            showToast(`Notice: Run SQL fix in Supabase if needed (${profError.message})`, "error");
                        } else {
                            showToast(`Inspector "${name}" created successfully!`, "success");
                            const modal = document.getElementById('modal-add-inspector');
                            if(modal) modal.classList.add('hidden');
                            addForm.reset();
                            renderInspectors();
                        }
                    } catch(err) {
                        console.error("Add inspector error:", err);
                        showToast(err.message || "Failed to create inspector", "error");
                    }
                };
            }

            // Setup Edit Form
            const editForm = $('#edit-inspector-form');
            if (editForm) {
                editForm.onsubmit = async (e) => {
                    e.preventDefault();
                    const id = $('#ei-id')?.value;
                    const name = $('#ei-name')?.value;
                    const phone = $('#ei-phone')?.value;
                    const password = $('#ei-password')?.value;

                    if(!id || !name) {
                        showToast("Please enter name", "error");
                        return;
                    }

                    showToast("Saving inspector details...", "info");

                    try {
                        const { error } = await client.from('profiles').update({
                            full_name: name,
                            phone: phone || ''
                        }).eq('id', id);

                        if (error) {
                            showToast(`Update error: ${error.message}`, "error");
                        } else {
                            showToast(`Inspector "${name}" updated successfully!`, "success");
                            document.getElementById('modal-edit-inspector').classList.add('hidden');
                            editForm.reset();
                            renderInspectors();
                        }
                    } catch(err) {
                        console.error("Edit inspector error:", err);
                        showToast(err.message || "Failed to update inspector", "error");
                    }
                };
            }
        }

        window.openEditInspectorModal = function(id, name, phone) {
            if($('#ei-id')) $('#ei-id').value = id;
            if($('#ei-name')) $('#ei-name').value = name;
            if($('#ei-phone')) $('#ei-phone').value = phone || '';
            if($('#ei-password')) $('#ei-password').value = '';
            const modal = document.getElementById('modal-edit-inspector');
            if(modal) modal.classList.remove('hidden');
        };

        window.deleteInspector = async function(id, name) {
            if(!confirm(`Are you sure you want to remove inspector "${name}"?`)) return;
            const client = dbClient || window.supabase;
            if(!client) return;

            showToast(`Removing inspector "${name}"...`, 'info');

            try {
                // 1. Unassign any bookings assigned to this inspector
                await client.from('bookings').update({ inspector_id: null, status: 'pending' }).eq('inspector_id', id);

                // 2. Delete profile
                const { data, error } = await client.from('profiles').delete().eq('id', id).select();

                if (error) {
                    console.error("Delete error:", error);
                    showToast(`Delete error: ${error.message}`, 'error');
                } else if (!data || data.length === 0) {
                    console.warn("Delete returned 0 rows - RLS policy blocking delete");
                    showToast(`Could not delete "${name}". Run the 1-line SQL fix in Supabase SQL Editor.`, 'error');
                } else {
                    showToast(`Inspector "${name}" removed successfully!`, 'success');
                    await renderInspectors();
                }
            } catch(err) {
                console.error("deleteInspector catch:", err);
                showToast(err.message || 'Error deleting inspector', 'error');
            }
        };

        window.toggleInspector = async function(id, isActive) {
            const client = dbClient || window.supabase;
            if(!client) return;
            const { error } = await client.from('profiles').update({ is_active: isActive }).eq('id', id);
            if(!error) {
                showToast(`Inspector ${isActive ? 'activated' : 'deactivated'}`, 'success');
                renderInspectors();
            }
        };

        // --- ANALYTICS ---
        async function renderAnalytics() {
            const client = dbClient || window.supabase;
            if(!client) return;
            const { data } = await client.from('bookings').select('total_price, status, package_name');
            if(data) {
                let rev = 0;
                let completed = 0;
                data.forEach(b => {
                    if(b.status !== 'cancelled') rev += (Number(b.total_price) || 0);
                    if(b.status === 'completed') completed++;
                });
                
                if($('#stat-rev')) $('#stat-rev').textContent = formatCurrency(rev);
                if($('#stat-avg')) $('#stat-avg').textContent = formatCurrency(data.length ? rev/data.length : 0);
                if($('#stat-rate')) $('#stat-rate').textContent = data.length ? Math.round((completed/data.length)*100) + '%' : '0%';
            }
        }

        // --- CAR DATABASE ---
        let dbMakesCache = [];
        let dbAllModels = [];
        let dbCurrentPage = 1;
        const DB_PAGE_SIZE = 25;

        async function renderDatabase() {
            await loadDbMakesForFilters();
            await loadDbModels();
            setupDbForms();
        }

        async function loadDbMakesForFilters() {
            const client = dbClient || window.supabase;
            const filterSelect = $('#db-filter-make');
            const amdMakeSelect = $('#amd-make');
            if (!client) return;

            try {
                const { data, error } = await client.from('car_makes').select('id, name').order('name');
                if (error) throw error;
                dbMakesCache = data || [];

                if (filterSelect) {
                    filterSelect.innerHTML = '<option value="">— All Makes —</option>';
                    dbMakesCache.forEach(m => {
                        filterSelect.innerHTML += `<option value="${m.id}">${m.name}</option>`;
                    });
                }
                if (amdMakeSelect) {
                    amdMakeSelect.innerHTML = '<option value="">— Select Make —</option>';
                    dbMakesCache.forEach(m => {
                        amdMakeSelect.innerHTML += `<option value="${m.id}">${m.name}</option>`;
                    });
                }
            } catch(e) {
                console.error('loadDbMakesForFilters error:', e);
            }
        }

        window.loadDbModels = async function() {
            const client = dbClient || window.supabase;
            const modelsTbody = $('#db-models-list');
            if (!client || !modelsTbody) return;

            modelsTbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:30px;" class="text-secondary">Loading...</td></tr>';

            const makeFilter = $('#db-filter-make')?.value || '';
            const pkgFilter = $('#db-filter-pkg')?.value || '';
            dbCurrentPage = 1;

            try {
                // Simple query — no nested join (avoids schema cache issues)
                let query = client.from('car_models')
                    .select('id, name, super_value, luxury_expert, quick_delivery, make_id')
                    .order('name');

                if (makeFilter) query = query.eq('make_id', makeFilter);
                if (pkgFilter) query = query.eq(pkgFilter, true);

                const { data, error } = await query;
                if (error) throw error;

                // If we don't have makes cache yet, fetch it now
                if (!dbMakesCache || dbMakesCache.length === 0) {
                    const { data: makesData } = await client.from('car_makes').select('id, name').order('name');
                    dbMakesCache = makesData || [];
                }

                // Build a lookup map for makes: id -> name
                const makeLookup = {};
                dbMakesCache.forEach(m => { makeLookup[m.id] = m.name; });

                // Attach make name client-side
                dbAllModels = (data || []).map(m => ({
                    ...m,
                    car_makes: { name: makeLookup[m.make_id] || '' }
                }));

                renderDbPage();
            } catch(e) {
                console.error('loadDbModels error:', e);
                modelsTbody.innerHTML = `<tr><td colspan="6" class="text-danger" style="text-align:center;padding:20px;">Error: ${e.message}. Check Supabase connection.</td></tr>`;
            }
        };


        function renderDbPage() {
            const modelsTbody = $('#db-models-list');
            if (!modelsTbody) return;

            const total = dbAllModels.length;
            const totalPages = Math.max(1, Math.ceil(total / DB_PAGE_SIZE));
            dbCurrentPage = Math.min(dbCurrentPage, totalPages);
            const start = (dbCurrentPage - 1) * DB_PAGE_SIZE;
            const pageItems = dbAllModels.slice(start, start + DB_PAGE_SIZE);

            if (pageItems.length === 0) {
                modelsTbody.innerHTML = '<tr><td colspan="6" class="text-secondary" style="text-align:center;padding:30px;">No models found. Run the seed SQL first or add models above.</td></tr>';
            } else {
                modelsTbody.innerHTML = pageItems.map(m => {
                    const makeName = m.car_makes ? m.car_makes.name : '';
                    const svCls = m.super_value ? 'sv-on' : 'sv-off';
                    const lxCls = m.luxury_expert ? 'lx-on' : 'lx-off';
                    const qdCls = m.quick_delivery ? 'qd-on' : 'qd-off';
                    return `<tr>
                        <td style="font-size:12px;color:var(--text-secondary);">${makeName}</td>
                        <td><strong>${m.name}</strong></td>
                        <td style="text-align:center;">
                            <button class="db-pkg-toggle ${svCls}" onclick="toggleModelPkg('${m.id}','super_value',${!m.super_value})">
                                ${m.super_value ? '✓ ON' : '✗ OFF'}
                            </button>
                        </td>
                        <td style="text-align:center;">
                            <button class="db-pkg-toggle ${lxCls}" onclick="toggleModelPkg('${m.id}','luxury_expert',${!m.luxury_expert})">
                                ${m.luxury_expert ? '✓ ON' : '✗ OFF'}
                            </button>
                        </td>
                        <td style="text-align:center;">
                            <button class="db-pkg-toggle ${qdCls}" onclick="toggleModelPkg('${m.id}','quick_delivery',${!m.quick_delivery})">
                                ${m.quick_delivery ? '✓ ON' : '✗ OFF'}
                            </button>
                        </td>
                        <td>
                            <button onclick="deleteModel('${m.id}','${m.name.replace(/'/g, "\\'")}')"
                                style="background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.4);color:#ef4444;padding:3px 8px;border-radius:6px;cursor:pointer;font-size:12px;">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </td>
                    </tr>`;
                }).join('');
            }

            // Update pagination
            const countEl = $('#db-count');
            const pageInfoEl = $('#db-page-info');
            const prevBtn = $('#db-prev-btn');
            const nextBtn = $('#db-next-btn');
            if (countEl) countEl.textContent = `${total} models total`;
            if (pageInfoEl) pageInfoEl.textContent = `Page ${dbCurrentPage} of ${totalPages}`;
            if (prevBtn) prevBtn.disabled = dbCurrentPage <= 1;
            if (nextBtn) nextBtn.disabled = dbCurrentPage >= totalPages;
        }

        window.dbChangePage = function(dir) {
            dbCurrentPage += dir;
            renderDbPage();
        };

        window.toggleModelPkg = async function(id, field, newVal) {
            const client = dbClient || window.supabase;
            const { error } = await client.from('car_models').update({ [field]: newVal }).eq('id', id);
            if (error) { showToast(`Error: ${error.message}`, 'error'); return; }
            // Update local cache
            const item = dbAllModels.find(m => m.id === id);
            if (item) item[field] = newVal;
            renderDbPage();
            showToast(`Package mapping updated!`, 'success');
        };

        function setupDbForms() {
            const addMakeForm = $('#add-make-form');
            if (addMakeForm && !addMakeForm._bound) {
                addMakeForm._bound = true;
                addMakeForm.onsubmit = async (e) => {
                    e.preventDefault();
                    const client = dbClient || window.supabase;
                    const name = $('#am-name')?.value.trim();
                    if (!name) { showToast('Please enter a make name', 'error'); return; }
                    const { error } = await client.from('car_makes').insert({ name });
                    if (error) { showToast(`Error: ${error.message}`, 'error'); }
                    else {
                        showToast(`"${name}" added!`, 'success');
                        document.getElementById('modal-add-make').classList.add('hidden');
                        addMakeForm.reset();
                        await loadDbMakesForFilters();
                    }
                };
            }

            const addModelForm = $('#add-model-form');
            if (addModelForm && !addModelForm._bound) {
                addModelForm._bound = true;
                addModelForm.onsubmit = async (e) => {
                    e.preventDefault();
                    const client = dbClient || window.supabase;
                    const makeId = $('#amd-make')?.value;
                    const name = $('#amd-name')?.value.trim();
                    const sv = $('#amd-sv')?.checked || false;
                    const lx = $('#amd-lx')?.checked !== false;
                    const qd = $('#amd-qd')?.checked !== false;
                    if (!makeId || !name) { showToast('Please select make and enter model name', 'error'); return; }
                    const { error } = await client.from('car_models').insert({ make_id: makeId, name, super_value: sv, luxury_expert: lx, quick_delivery: qd });
                    if (error) { showToast(`Error: ${error.message}`, 'error'); }
                    else {
                        showToast(`"${name}" added!`, 'success');
                        document.getElementById('modal-add-model').classList.add('hidden');
                        addModelForm.reset();
                        await loadDbModels();
                    }
                };
            }
        }

        window.openAddMakeModal = function() {
            const modal = document.getElementById('modal-add-make');
            if (modal) modal.classList.remove('hidden');
        };

        window.openAddModelModal = function() {
            const modal = document.getElementById('modal-add-model');
            if (modal) { modal.classList.remove('hidden'); }
        };

        window.deleteMake = async function(id, name) {
            if (!confirm(`Delete make "${name}"? All its models will also be deleted.`)) return;
            const client = dbClient || window.supabase;
            const { error } = await client.from('car_makes').delete().eq('id', id);
            if (error) showToast(`Error: ${error.message}`, 'error');
            else { showToast(`"${name}" deleted`, 'success'); await loadDbMakesForFilters(); await loadDbModels(); }
        };

        window.deleteModel = async function(id, name) {
            if (!confirm(`Delete model "${name}"?`)) return;
            const client = dbClient || window.supabase;
            const { error } = await client.from('car_models').delete().eq('id', id);
            if (error) showToast(`Error: ${error.message}`, 'error');
            else {
                showToast(`"${name}" deleted`, 'success');
                dbAllModels = dbAllModels.filter(m => m.id !== id);
                renderDbPage();
            }
        };
    </script>

</body>
</html>
