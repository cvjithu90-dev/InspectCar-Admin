<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InspectCar Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
        :root {
            --bg-color: #0E0E1C;
            --surface-color: #161625;
            --surface-color-hover: #1f1f33;
            --accent-primary: #6366F1;
            --accent-secondary: #8B5CF6;
            --accent-light: #A78BFA;
            --text-primary: #F4F4F6;
            --text-secondary: #9CA3AF;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
            --border-color: #2D2D3F;
            --sidebar-width: 240px;
            --header-height: 64px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        a {
            color: var(--accent-light);
            text-decoration: none;
        }

        button {
            cursor: pointer;
            font-family: inherit;
        }

        input, select, textarea {
            font-family: inherit;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.5rem;
            border-radius: 4px;
        }

        select option {
            background-color: #161625 !important;
            color: #F4F4F6 !important;
            padding: 6px 10px;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        /* Layout */
        #app {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--surface-color);
            border-right: 1px solid var(--border-color);
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            z-index: 100;
        }

        .sidebar-header {
            height: var(--header-height);
            display: flex;
            align-items: center;
            padding: 0 1.5rem;
            border-bottom: 1px solid var(--border-color);
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--text-primary);
        }

        .sidebar-nav {
            flex: 1;
            padding: 1rem 0;
            overflow-y: auto;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 0.75rem 1.5rem;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .nav-item:hover, .nav-item.active {
            background-color: rgba(99, 102, 241, 0.1);
            color: var(--accent-primary);
            border-right: 3px solid var(--accent-primary);
        }

        .nav-item span {
            margin-right: 0.75rem;
        }

        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            display: flex;
            flex-direction: column;
        }

        .topbar {
            height: var(--header-height);
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            position: sticky;
            top: 0;
            z-index: 90;
        }

        .page-content {
            padding: 2rem;
            flex: 1;
        }

        /* Cards */
        .card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1rem; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5rem; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
        .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; }
        
        .stat-card {
            display: flex;
            flex-direction: column;
        }
        
        .stat-title {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 1.75rem;
            font-weight: bold;
        }

        /* Badges */
        .badge {
            padding: 0.25rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
        }
        .badge-pending { background-color: rgba(245, 158, 11, 0.2); color: var(--warning); }
        .badge-assigned { background-color: rgba(99, 102, 241, 0.2); color: var(--accent-light); }
        .badge-in_progress { background-color: rgba(245, 158, 11, 0.2); color: #F97316; }
        .badge-completed { background-color: rgba(16, 185, 129, 0.2); color: var(--success); }
        .badge-cancelled { background-color: rgba(239, 68, 68, 0.2); color: var(--danger); }

        /* Tables */
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.875rem;
        }

        tbody tr:hover {
            background-color: rgba(255,255,255,0.02);
        }

        /* Buttons */
        .btn {
            padding: 0.5rem 1rem;
            border-radius: 4px;
            border: none;
            font-weight: 500;
            text-align: center;
            display: inline-block;
            transition: opacity 0.2s;
        }

        .btn:hover { opacity: 0.9; }
        
        .btn-primary {
            background-color: var(--accent-primary);
            color: white;
        }
        
        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }
        
        .btn-danger {
            background-color: var(--danger);
            color: white;
        }

        /* Forms */
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }
        .form-control {
            width: 100%;
        }

        /* Login Screen */
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100vw;
            background: radial-gradient(circle at center, #1f1f33 0%, #0E0E1C 100%);
        }
        .login-card {
            background: rgba(22, 22, 37, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            width: 400px;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }
        .login-card h1 {
            margin-bottom: 2rem;
            color: white;
            font-size: 1.5rem;
        }
        
        /* Toast */
        #toast-container {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .toast {
            padding: 1rem 1.5rem;
            border-radius: 4px;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            animation: slideIn 0.3s ease-out;
            max-width: 300px;
        }
        .toast.success { background-color: var(--success); }
        .toast.error { background-color: var(--danger); }
        .toast.info { background-color: var(--accent-primary); }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Utilities */
        .mt-1 { margin-top: 0.25rem; }
        .mt-2 { margin-top: 0.5rem; }
        .mt-4 { margin-top: 1rem; }
        .mb-4 { margin-bottom: 1rem; }
        .flex { display: flex; }
        .justify-between { justify-content: space-between; }
        .items-center { align-items: center; }
        .gap-2 { gap: 0.5rem; }
        .gap-4 { gap: 1rem; }
        .text-right { text-align: right; }
        .text-sm { font-size: 0.875rem; }
        .text-danger { color: var(--danger); }
        
        /* Analytics Charts (CSS only) */
        .bar-chart {
            display: flex;
            align-items: flex-end;
            height: 200px;
            gap: 10px;
            padding-top: 20px;
            border-bottom: 1px solid var(--border-color);
            border-left: 1px solid var(--border-color);
            padding-left: 10px;
        }
        .bar {
            flex: 1;
            background-color: var(--accent-primary);
            border-radius: 4px 4px 0 0;
            position: relative;
            min-height: 5px;
            transition: height 0.5s;
        }
        .bar span {
            position: absolute;
            top: -20px;
            width: 100%;
            text-align: center;
            font-size: 10px;
            color: var(--text-secondary);
        }
        
        .pie-chart {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: conic-gradient(
                var(--accent-primary) 0% 45%,
                var(--accent-secondary) 45% 75%,
                var(--accent-light) 75% 100%
            );
            margin: 0 auto;
        }
        .pie-legend {
            margin-top: 1rem;
            display: flex;
            justify-content: center;
            gap: 1rem;
        }
        .legend-item {
            display: flex;
            align-items: center;
            font-size: 0.875rem;
        }
        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 2px;
            margin-right: 4px;
        }
        
        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal {
            background: var(--surface-color);
            padding: 2rem;
            border-radius: 8px;
            width: 400px;
            border: 1px solid var(--border-color);
        }
        .hidden { display: none !important; }
    </style>
    <!-- PDF.js: client-side PDF text extraction for Service History auto-capture -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
    <div id="toast-container"></div>
    <div id="app">
        <div class="login-container">
            <div class="login-card">
                <h1><i class="fas fa-shield-alt" style="color:var(--accent-primary);"></i> InspectCar Admin</h1>
                <form id="login-form" onsubmit="event.preventDefault(); handleSignIn(event);">
                    <div class="form-group">
                        <input type="email" id="login-email" class="form-control" placeholder="Email Address" required>
                    </div>
                    <div class="form-group">
                        <input type="password" id="login-password" class="form-control" placeholder="Password" required>
                    </div>
                    <div id="login-error" class="text-danger text-sm mb-4"></div>
                    <button type="button" id="btn-login-submit" onclick="handleSignIn(event)" class="btn btn-primary form-control">Sign In</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Login View Template -->
    <template id="view-login">
        <div class="login-container">
            <div class="login-card">
                <h1><i class="fas fa-shield-alt" style="color:var(--accent-primary);"></i> InspectCar Admin</h1>
                <form id="login-form">
                    <div class="form-group mb-3">
                        <input type="email" id="login-email" class="form-control" placeholder="Email Address" required value="cvjithu90@gmail.com">
                    </div>
                    <div class="form-group mb-3">
                        <input type="password" id="login-password" class="form-control" placeholder="Password" required>
                    </div>
                    <div id="login-error" class="text-danger text-sm mb-3" style="min-height:20px;"></div>
                    <button type="submit" id="btn-login-submit" class="btn btn-primary form-control" style="font-weight:700;padding:12px;cursor:pointer;">Sign In</button>
                </form>
            </div>
        </div>
    </template>

    <!-- Shell for authenticated routes -->
    <template id="app-shell">
        <div class="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-shield-alt" style="color:var(--accent-primary);margin-right:6px;"></i> InspectCar
            </div>
            <div class="sidebar-nav">
                <a href="#/dashboard" class="nav-item" data-path="/dashboard"><span><i class="fas fa-chart-line"></i></span> Dashboard</a>
                <a href="#/bookings" class="nav-item" data-path="/bookings"><span><i class="fas fa-clipboard-list"></i></span> Bookings</a>
                <a href="#/new-booking" class="nav-item" data-path="/new-booking"><span><i class="fas fa-plus-circle"></i></span> New Booking</a>
                <a href="#/reports" class="nav-item" data-path="/reports"><span><i class="fas fa-file-pdf"></i></span> Reports</a>
                <a href="#/inspectors" class="nav-item" data-path="/inspectors"><span><i class="fas fa-user-shield"></i></span> Inspectors</a>
                <a href="#/analytics" class="nav-item" data-path="/analytics"><span><i class="fas fa-chart-pie"></i></span> Analytics</a>
                <a href="#/database" class="nav-item" data-path="/database"><span><i class="fas fa-database"></i></span> Car Database</a>
                <a href="#" id="logout-btn" class="nav-item mt-4" style="border-top: 1px solid var(--border-color);"><span><i class="fas fa-sign-out-alt"></i></span> Logout</a>
            </div>
        </div>
        <div class="main-content">
            <div class="topbar">
                <div id="header-greeting" class="font-bold">Hello, Admin</div>
                <div id="header-date" class="text-sm text-secondary"></div>
            </div>
            <div id="page-container" class="page-content">
                <!-- Page specific content goes here -->
            </div>
        </div>
    </template>

    <!-- Dashboard View -->
    <template id="view-dashboard">
        <div class="flex justify-between items-center mb-4">
            <h2>Dashboard Overview</h2>
            <div class="gap-2 flex">
                <a href="#/new-booking" class="btn btn-primary">New Booking</a>
                <a href="#/bookings" class="btn btn-secondary">View All</a>
            </div>
        </div>
        
        <div class="grid-5 mb-4">
            <div class="card stat-card">
                <span class="stat-title">Total Revenue</span>
                <span class="stat-value text-success" id="dash-total-revenue">-</span>
            </div>
            <div class="card stat-card">
                <span class="stat-title">Revenue This Month</span>
                <span class="stat-value text-success" id="dash-revenue">-</span>
            </div>
            <div class="card stat-card">
                <span class="stat-title">Total Bookings</span>
                <span class="stat-value" id="dash-total-bookings">-</span>
            </div>
            <div class="card stat-card">
                <span class="stat-title">Today's Bookings</span>
                <span class="stat-value" id="dash-today-bookings">-</span>
            </div>
            <div class="card stat-card">
                <span class="stat-title">Pending Assignment</span>
                <span class="stat-value text-warning" id="dash-pending-bookings">-</span>
            </div>
        </div>

        <div class="grid-2">
            <div class="card">
                <h3 class="mb-4">Live Booking Feed</h3>
                <div class="brand-logo text-center mb-4">
                    <h1><i class="fas fa-shield-alt" style="color:var(--accent-primary);"></i> InspectCar Admin</h1>
                    <p class="text-secondary text-sm">Control Panel</p>
                </div>
            </div>
            <div class="card">
                <h3 class="mb-4">Pipeline Status</h3>
                <div class="flex flex-col gap-4">
                    <div class="flex justify-between items-center p-2" style="background: rgba(245, 158, 11, 0.1); border-radius: 4px;">
                        <span>Pending</span> <span class="badge badge-pending" id="pipe-pending">0</span>
                    </div>
                    <div class="flex justify-between items-center p-2" style="background: rgba(99, 102, 241, 0.1); border-radius: 4px;">
                        <span>Assigned</span> <span class="badge badge-assigned" id="pipe-assigned">0</span>
                    </div>
                    <div class="flex justify-between items-center p-2" style="background: rgba(245, 158, 11, 0.1); border-radius: 4px;">
                        <span>In Progress</span> <span class="badge badge-in_progress" id="pipe-inprogress">0</span>
                    </div>
                    <div class="flex justify-between items-center p-2" style="background: rgba(16, 185, 129, 0.1); border-radius: 4px;">
                        <span>Completed</span> <span class="badge badge-completed" id="pipe-completed">0</span>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- Bookings List View -->
    <template id="view-bookings">
        <div class="flex justify-between items-center mb-4">
            <h2>All Bookings</h2>
            <div class="flex gap-2">
                <input type="text" id="bookings-search" class="form-control" placeholder="Search ref, name, phone..." style="width: 250px;">
                <select id="bookings-status-filter" class="form-control">
                    <option value="">All Statuses</option>
                    <option value="pending">Pending</option>
                    <option value="assigned">Assigned</option>
                    <option value="in_progress">In Progress</option>
                    <option value="completed">Completed</option>
                    <option value="cancelled">Cancelled</option>
                </select>
            </div>
        </div>

        <div class="card" style="padding: 0; overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Ref</th>
                        <th>Customer</th>
                        <th>Vehicle</th>
                        <th>Date & Time</th>
                        <th>Package</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="bookings-table-body">
                    <tr><td colspan="7" class="text-center">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </template>

    <!-- Booking Detail View -->
    <template id="view-booking-detail">
        <div class="mb-4">
            <a href="#/bookings" class="text-secondary">← Back to Bookings</a>
        </div>
        
        <div class="flex justify-between items-center mb-4">
            <h2 id="detail-ref">Booking Ref</h2>
            <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
                <button id="btn-share-whatsapp-booking" style="display:flex; align-items:center; gap:7px; background:#25D366; color:#fff; border:none; border-radius:8px; padding:8px 16px; font-size:13px; font-weight:700; cursor:pointer; box-shadow:0 2px 8px rgba(37,211,102,0.25); transition:opacity 0.2s;" onmouseenter="this.style.opacity='0.85'" onmouseleave="this.style.opacity='1'">
                    <i class="fab fa-whatsapp" style="font-size:16px;"></i> Share Booking Details
                </button>
                <div id="detail-status-badge"></div>
            </div>
        </div>

        <div class="grid-2 mb-4">
            <div class="card">
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h3 style="margin:0;">Customer &amp; Location</h3>
                    <button id="btn-edit-customer" class="btn btn-secondary text-xs" style="padding: 4px 10px; cursor: pointer;">
                        <i class="fas fa-user-edit"></i> Edit Customer
                    </button>
                </div>
                <div class="grid-2 gap-2 text-sm" id="customer-view-mode">
                    <div class="text-secondary">Name:</div><div id="detail-customer-name"></div>
                    <div class="text-secondary">Phone:</div><div id="detail-customer-phone"></div>
                    <div class="text-secondary">Email:</div><div id="detail-customer-email"></div>
                    <div class="text-secondary">Area:</div><div id="detail-area"></div>
                    <div class="text-secondary">Address:</div><div id="detail-address"></div>
                </div>

                <!-- Customer Edit Form -->
                <div id="customer-edit-mode" class="hidden">
                    <div class="grid-2 gap-3 text-sm mb-3">
                        <div>
                            <label class="text-secondary text-xs block mb-1">Customer Name *</label>
                            <input type="text" id="edit-customer-name" class="form-control text-sm" />
                        </div>
                        <div>
                            <label class="text-secondary text-xs block mb-1">Phone Number *</label>
                            <input type="text" id="edit-customer-phone" class="form-control text-sm" />
                        </div>
                        <div>
                            <label class="text-secondary text-xs block mb-1">Email Address</label>
                            <input type="email" id="edit-customer-email" class="form-control text-sm" />
                        </div>
                        <div>
                            <label class="text-secondary text-xs block mb-1">Area / Suburb</label>
                            <input type="text" id="edit-area" class="form-control text-sm" />
                        </div>
                        <div style="grid-column: span 2;">
                            <label class="text-secondary text-xs block mb-1">Inspection Address</label>
                            <textarea id="edit-address" class="form-control text-sm" rows="2"></textarea>
                        </div>
                    </div>
                    <div class="flex gap-2 justify-end">
                        <button id="btn-cancel-edit-customer" class="btn btn-secondary text-xs">Cancel</button>
                        <button id="btn-save-customer" class="btn btn-primary text-xs"><i class="fas fa-save"></i> Save Customer</button>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h3 style="margin:0;">Vehicle &amp; Package</h3>
                    <button id="btn-edit-vehicle" class="btn btn-secondary text-xs" style="padding: 4px 10px; cursor: pointer;">
                        <i class="fas fa-car-side"></i> Edit Vehicle
                    </button>
                </div>
                <div class="grid-2 gap-2 text-sm" id="vehicle-view-mode">
                    <div class="text-secondary">Vehicle:</div><div id="detail-vehicle"></div>
                    <div class="text-secondary">Reg No:</div><div id="detail-reg"></div>
                    <div class="text-secondary">Package:</div><div id="detail-package"></div>
                    <div class="text-secondary">Amount:</div><div id="detail-price"></div>
                    <div class="text-secondary">Date:</div><div id="detail-datetime"></div>
                </div>

                <!-- Vehicle Edit Form -->
                <div id="vehicle-edit-mode" class="hidden">
                    <div class="grid-2 gap-3 text-sm mb-3">
                        <div>
                            <label class="text-secondary text-xs block mb-1">Brand Make</label>
                            <input type="text" id="edit-vehicle-brand" class="form-control text-sm" />
                        </div>
                        <div>
                            <label class="text-secondary text-xs block mb-1">Model Name</label>
                            <input type="text" id="edit-vehicle-model" class="form-control text-sm" />
                        </div>
                        <div>
                            <label class="text-secondary text-xs block mb-1">Year</label>
                            <input type="number" id="edit-vehicle-year" class="form-control text-sm"
                              min="1990" placeholder="e.g. 2026" />
                        </div>
                        <div>
                            <label class="text-secondary text-xs block mb-1">Fuel Type</label>
                            <select id="edit-vehicle-fuel" class="form-control text-sm">

    <script>
        // ==========================================

        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZrbGF1aXd1Z2h5Z2RwdmZ5bHdnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyMjA0MjIsImV4cCI6MjEwMDc5NjQyMn0.t4KEH1g9TZTW8DgG1rpAU0fFVHXvmcEv86s0w7_jHdA';

        // ==========================================

        // ==========================================

        const $ = (selector) => document.querySelector(selector);
        
        function showToast(message, type = 'info') {
            const container = $('#toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                toast.style.transition = 'all 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function formatCurrency(amount) {
            return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(amount);
        }

        function formatDate(dateStr) {
            if(!dateStr) return '';
            return new Date(dateStr).toLocaleDateString('en-IN', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        // ==========================================
        // Routing & View Management
        // ==========================================
        // ==========================================
        // Routing & View Management
        // ==========================================
        async function router() {
            try {
                let rawHash = window.location.hash || '#/login';
                if (rawHash === '' || rawHash === '#') rawHash = '#/login';
                let path = rawHash.split('?')[0];
                
                let session = null;
                if (dbClient && dbClient.auth) {
                    try {
                        const { data } = await dbClient.auth.getSession();
                        session = data ? data.session : null;
                    } catch (e) {
                        console.warn("Auth getSession error:", e);
                    }
                }
                
                const isAuthenticated = Boolean(session || state.user);
                
                if (!isAuthenticated) {
                    if (window.location.hash !== '#/login') {
                        window.location.hash = '#/login';
                    }
                    const appEl = $('#app');
                    const loginTpl = $('#view-login');
                    if (appEl && loginTpl && !document.getElementById('login-form')) {
                        appEl.innerHTML = loginTpl.innerHTML;
                    }
                    setupLoginForm();
                    return;
                }

                if (session) {
                    state.user = session.user;
                    state.profile = { id: session.user.id, full_name: session.user.user_metadata?.full_name || 'Admin', role: 'admin' };
                }

                if (isAuthenticated && (path === '#/login' || path === '' || path === '#')) {
                    window.location.hash = '#/dashboard';
                    path = '#/dashboard';
                }

                if (isAuthenticated && !document.querySelector('.sidebar')) {
                    const appEl = $('#app');
                    const shellTpl = $('#app-shell');
                    if (appEl && shellTpl) {
                        appEl.innerHTML = shellTpl.innerHTML;
                        updateHeader();
                        setupShellEvents();
                        setupRealtime();
                    }
                }

                let viewTemplateId = 'view-dashboard';
                let renderLogic = renderDashboard;

                if (path === '#/dashboard') {
                    viewTemplateId = 'view-dashboard';
                    renderLogic = renderDashboard;
                } else if (path === '#/bookings') {
                    viewTemplateId = 'view-bookings';
                    renderLogic = renderBookings;
                } else if (path.startsWith('#/booking/')) {
                    state.currentBookingId = path.split('/')[2];
                    viewTemplateId = 'view-booking-detail';
                    renderLogic = renderBookingDetail;
                } else if (path === '#/new-booking') {
                    viewTemplateId = 'view-new-booking';
                    renderLogic = renderNewBooking;
                } else if (path === '#/inspectors') {
                    viewTemplateId = 'view-inspectors';
                    renderLogic = renderInspectors;
                } else if (path === '#/analytics') {
                    viewTemplateId = 'view-analytics';
                    renderLogic = renderAnalytics;
                } else if (path === '#/database') {
                    viewTemplateId = 'view-database';
                    renderLogic = renderDatabase;
                } else if (path === '#/reports') {
                    viewTemplateId = 'view-reports';
                    renderLogic = renderReports;
                } else if (path.startsWith('#/report/')) {
                    // Full-screen wizard — takes over #app entirely
                    state.currentBookingId = path.split('/')[2];
                    await openReportWizard(state.currentBookingId);
                    return;
                }

                const pageContainer = $('#page-container');
                const viewTpl = $(`#${viewTemplateId}`);
                if (pageContainer && viewTpl) {
                    pageContainer.innerHTML = viewTpl.innerHTML;
                    updateNavActiveState(path);
                    updateHeader();
                    if (typeof renderLogic === 'function') {
                        try {
                            await renderLogic();
                        } catch(renderErr) {
                            console.error("Render error in view:", renderErr);
                        }
                    }
                }
            } catch (err) {
                console.error("Router error:", err);
            }
        }

        window.addEventListener('hashchange', router);
        window.addEventListener('load', router);

        // ==========================================
        // Core Setup
        // ==========================================
        function updateHeader() {
            const today = new Date();
            const dateString = today.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            if($('#header-date')) $('#header-date').textContent = dateString;
            
            const hour = today.getHours();
            let timeGreeting = 'Hello';
            if (hour >= 5 && hour < 12) timeGreeting = 'Good Morning';
            else if (hour >= 12 && hour < 17) timeGreeting = 'Good Afternoon';
            else if (hour >= 17 && hour < 22) timeGreeting = 'Good Evening';

            const name = (state && state.profile && state.profile.full_name) ? state.profile.full_name.split(' ')[0] : 'Admin';
            if($('#header-greeting')) $('#header-greeting').textContent = `${timeGreeting}, ${name}`;
        }

        function updateNavActiveState(currentPath) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            const activeEl = document.querySelector(`.nav-item[data-path="${currentPath.replace('#', '')}"]`);
            if (activeEl) activeEl.classList.add('active');
        }

        function setupShellEvents() {
            $('#logout-btn')?.addEventListener('click', async (e) => {
                e.preventDefault();
                if (dbClient && dbClient.auth) await dbClient.auth.signOut();
                state = { user: null, profile: null };
                if (realtimeSubscription && dbClient) dbClient.removeChannel(realtimeSubscription);
                window.location.hash = '#/login';
                router();
            });
        }

        function setupRealtime() {
            if (realtimeSubscription || !dbClient) return;
            realtimeSubscription = dbClient.channel('public:bookings')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'bookings' }, payload => {
                    showToast(`New booking received: ${payload.new.booking_ref}`, 'success');
                    if (window.location.hash === '#/dashboard') renderDashboard();
                    if (window.location.hash === '#/bookings') renderBookings();
                })
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'bookings' }, payload => {
                    if (window.location.hash === '#/dashboard') renderDashboard();
                    if (window.location.hash === '#/bookings') renderBookings();
                })
                .subscribe();
        }

        // ==========================================
        // View Renderers & Logic
        // ==========================================

        // --- LOGIN ---
        window.handleSignIn = async function(e) {
            if (e) e.preventDefault();
            
            const emailInput = document.getElementById('login-email');
            const passwordInput = document.getElementById('login-password');
            const errDiv = document.getElementById('login-error');
            const submitBtn = document.getElementById('btn-login-submit');

            const email = emailInput ? emailInput.value.trim() : '';
            const password = passwordInput ? passwordInput.value : '';

            if (!email || !password) {
                if (errDiv) errDiv.textContent = 'Please enter both email and password';
                return;
            }

            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.textContent = 'Signing in...';
            }
            if (errDiv) errDiv.textContent = 'Authenticating...';

            try {
                if (!dbClient && window.supabase && window.supabase.createClient) {
                    dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                }

                const { data, error } = await dbClient.auth.signInWithPassword({ email, password });
                if (error) {
                    console.error("Sign in error:", error);
                    if (errDiv) errDiv.textContent = error.message;
                    showToast(error.message, 'error');
                } else if (data && data.session) {
                    state.user = data.session.user;
                    state.profile = { id: data.session.user.id, full_name: 'Admin', role: 'admin' };

                    if (errDiv) errDiv.textContent = 'Success! Opening dashboard...';
                    showToast('Sign in successful!', 'success');
                    window.location.hash = '#/dashboard';
                    await router();
                }
            } catch(err) {
                console.error("Sign in catch:", err);
                if (errDiv) errDiv.textContent = err.message || 'Error signing in.';
                showToast(err.message || 'Sign in error', 'error');
            } finally {
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Sign In';
                }
            }
        };

        function setupLoginForm() {
            const form = document.getElementById('login-form');
            if (form && !form._bound) {
                form._bound = true;
                form.onsubmit = function(e) {
                    e.preventDefault();
                    window.handleSignIn(e);
                };
            }
        }

        // --- DASHBOARD ---
        async function renderDashboard() {
            const client = dbClient || window.supabase;
            if(!client) return;

            // Fetch Stats
            const { count: totalBookings } = await client.from('bookings').select('*', { count: 'exact', head: true });
            
            const today = new Date().toISOString().split('T')[0];
            const { count: todayBookings } = await client.from('bookings').select('*', { count: 'exact', head: true }).gte('created_at', today);
            
            const { count: pendingBookings } = await client.from('bookings').select('*', { count: 'exact', head: true }).eq('status', 'pending');
            
            // Total All-Time Revenue (excluding cancelled)
            const { data: allRevData } = await client.from('bookings').select('total_price, base_price').neq('status', 'cancelled');
            const totalAllRev = allRevData ? allRevData.reduce((sum, b) => sum + (Number(b.total_price) || Number(b.base_price) || 0), 0) : 0;

            // Monthly revenue
            const firstDay = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString();
            const { data: revData } = await client.from('bookings').select('total_price, base_price').gte('created_at', firstDay).neq('status', 'cancelled');
            const totalMonthRev = revData ? revData.reduce((sum, b) => sum + (Number(b.total_price) || Number(b.base_price) || 0), 0) : 0;

            if($('#dash-total-revenue')) $('#dash-total-revenue').textContent = formatCurrency(totalAllRev);
            if($('#dash-revenue')) $('#dash-revenue').textContent = formatCurrency(totalMonthRev);
            if($('#dash-total-bookings')) $('#dash-total-bookings').textContent = totalBookings || 0;
            if($('#dash-today-bookings')) $('#dash-today-bookings').textContent = todayBookings || 0;
            if($('#dash-pending-bookings')) $('#dash-pending-bookings').textContent = pendingBookings || 0;

            // Live Feed
            const { data: recent } = await client.from('bookings').select('*').order('created_at', { ascending: false }).limit(5);
            const feedContainer = $('#live-feed');
            if(feedContainer) {
                feedContainer.innerHTML = '';
                if(recent && recent.length > 0) {
                    recent.forEach(b => {
                        feedContainer.innerHTML += `
                            <div class="flex justify-between items-center py-3 border-b" style="border-color: var(--border-color);">
                                <div>
                                    <div class="font-bold">${b.customer_name}</div>
                                    <div class="text-xs text-secondary">${b.vehicle_brand} ${b.vehicle_model} • ${formatDate(b.inspection_date)}</div>
                                </div>
                                <span class="badge badge-${b.status}">${b.status.replace('_', ' ')}</span>
                            </div>
                        `;
                    });
                } else {
                    feedContainer.innerHTML = '<p class="text-secondary text-sm">No recent bookings</p>';
                }
            }

            // Pipeline
            const { data: statusCounts } = await client.from('bookings').select('status');
            const counts = { pending: 0, assigned: 0, in_progress: 0, completed: 0, cancelled: 0 };
            if(statusCounts) statusCounts.forEach(b => counts[b.status]++);
            
            if($('#pipe-pending')) $('#pipe-pending').textContent = counts.pending;
            if($('#pipe-assigned')) $('#pipe-assigned').textContent = counts.assigned;
            if($('#pipe-inprogress')) $('#pipe-inprogress').textContent = counts.in_progress;
            if($('#pipe-completed')) $('#pipe-completed').textContent = counts.completed;
        }

        // --- BOOKINGS LIST ---
        async function renderBookings() {
             const tbody = $('#bookings-table-body');
             const statusFilter = $('#bookings-status-filter');
             const searchInput = $('#bookings-search');

             async function loadData() {
                 const client = dbClient || window.supabase;
                 if(!client) return;
                 let query = client.from('bookings').select('*, profiles(full_name)').order('created_at', { ascending: false }).limit(50);
                 
                 if(statusFilter.value) query = query.eq('status', statusFilter.value);
                 if(searchInput.value) {
                     const term = searchInput.value;
                     query = query.or(`booking_ref.ilike.%${term}%,customer_name.ilike.%${term}%,customer_phone.ilike.%${term}%`);
                 }

                 const { data, error } = await query;
                 tbody.innerHTML = '';
                 
                 if(error) {
                     tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger">Error loading data</td></tr>`;
                     return;
                 }

                 if(data.length === 0) {
                     tbody.innerHTML = `<tr><td colspan="7" class="text-center">No bookings found</td></tr>`;
                     return;
                 }

                 data.forEach(b => {
                     const inspectorName = b.profiles ? b.profiles.full_name : 'Unassigned';
                     tbody.innerHTML += `
                        <tr>
                            <td class="font-bold text-accent-light">${b.booking_ref}</td>
                            <td>
                                <div>${b.customer_name}</div>
                                <div class="text-xs text-secondary">${b.customer_phone}</div>
                            </td>
                            <td>${b.vehicle_brand} ${b.vehicle_model}</td>
                            <td>
                                <div>${formatDate(b.inspection_date)}</div>
                                <div class="text-xs text-secondary">${b.inspection_time}</div>
                            </td>
                            <td>${b.package_name}</td>
                            <td><span class="badge badge-${b.status}">${b.status.replace('_', ' ')}</span></td>
                            <td><a href="#/booking/${b.id}" class="btn btn-secondary text-sm">View</a></td>
                        </tr>
                     `;
                 });
             }

             loadData();
             statusFilter.addEventListener('change', loadData);
             
             let debounceTimeout;
             searchInput.addEventListener('input', () => {
                 clearTimeout(debounceTimeout);
                 debounceTimeout = setTimeout(loadData, 500);
             });
        }

        // --- BOOKING DETAIL ---
        async function fetchInspectors() {
             const client = dbClient || window.supabase;
             if(!client) return [];
             const { data } = await client.from('profiles').select('*').eq('role', 'inspector').eq('is_active', true);
             state.inspectors = data || [];
             return state.inspectors;
        }
