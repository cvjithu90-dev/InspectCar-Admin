<script>
// ============================================================
// REPORTS LIST
// ============================================================
async function renderReports() {
    const client = dbClient || window.supabase;
    const container = document.getElementById('reports-list-container');
    if (!container) return;
    if (!client) { container.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-secondary);">Database not connected.</div>'; return; }
    const { data, error } = await client.from('bookings')
        .select('*')
        .in('status', ['completed','report_draft','report_published'])
        .order('inspection_date', { ascending: false });
    if (error || !data || data.length === 0) {
        container.innerHTML = '<div style="padding:60px;text-align:center;color:var(--text-secondary);">No completed inspections found. Bookings with status <b>completed</b> will appear here.</div>';
        return;
    }
    const rows = data.map(b => `
        <tr style="border-bottom:1px solid var(--border-color);">
            <td style="padding:12px 16px;font-weight:700;color:var(--accent-light);">${b.booking_ref}</td>
            <td style="padding:12px 16px;">${b.customer_name}<div style="font-size:11px;color:var(--text-secondary);">${b.customer_phone}</div></td>
            <td style="padding:12px 16px;">${b.vehicle_brand||''} ${b.vehicle_model||''}</td>
            <td style="padding:12px 16px;">${formatDate(b.inspection_date)}</td>
            <td style="padding:12px 16px;"><span class="badge badge-${b.status}">${(b.report_status||b.status).replace(/_/g,' ')}</span></td>
            <td style="padding:12px 16px;">
                <button class="btn btn-primary" style="font-size:12px;" onclick="window.location.hash='#/report/${b.id}'">
                    <i class="fas fa-magic"></i> Open Wizard
                </button>
            </td>
        </tr>`).join('');
    container.innerHTML = `
        <table style="width:100%;border-collapse:collapse;">
            <thead style="border-bottom:2px solid var(--border-color);">
                <tr style="background:var(--surface-color-hover);">
                    <th style="padding:11px 16px;text-align:left;font-size:10px;color:var(--text-secondary);text-transform:uppercase;">Booking Ref</th>
                    <th style="padding:11px 16px;text-align:left;font-size:10px;color:var(--text-secondary);text-transform:uppercase;">Customer</th>
                    <th style="padding:11px 16px;text-align:left;font-size:10px;color:var(--text-secondary);text-transform:uppercase;">Vehicle</th>
                    <th style="padding:11px 16px;text-align:left;font-size:10px;color:var(--text-secondary);text-transform:uppercase;">Date</th>
                    <th style="padding:11px 16px;text-align:left;font-size:10px;color:var(--text-secondary);text-transform:uppercase;">Status</th>
                    <th style="padding:11px 16px;text-align:left;font-size:10px;color:var(--text-secondary);text-transform:uppercase;">Action</th>
                </tr>
            </thead>
            <tbody>${rows}</tbody>
        </table>`;
}

// ============================================================
// WIZARD CONTROLLER
// ============================================================
let wz = null;
let wzPreviewWindow = null;
let wzAutoSaveTimer = null;
let wzBroadcastChannel = null;
const WZ_LS_KEY = 'inspectcar_active_report';
const WZ_CHANNEL = 'inspectcar_report_channel';

const WIZARD_STEPS = [
    { id:1, label:'Vehicle Info',      icon:'fa-car' },
    { id:2, label:'Summary',           icon:'fa-star' },
    { id:3, label:'Technical',         icon:'fa-tools' },
    { id:4, label:'Scoring',           icon:'fa-chart-bar' },
    { id:5, label:'Service History',   icon:'fa-history' },
    { id:6, label:'Documents',         icon:'fa-folder-open' },
    { id:7, label:'Repair Estimate',   icon:'fa-wrench' },
    { id:8, label:'Admin Remarks',     icon:'fa-comment-alt' },
    { id:9, label:'Preview',           icon:'fa-eye' },
    { id:10, label:'Generate PDF',     icon:'fa-file-pdf' }
];

async function openReportWizard(bookingId) {
    const appEl = $('#app');
    if (!appEl) return;
    if (wzAutoSaveTimer) { clearInterval(wzAutoSaveTimer); wzAutoSaveTimer = null; }

    // Build full-screen wizard shell
    appEl.innerHTML = buildWizardShell();

    try { wzBroadcastChannel = new BroadcastChannel(WZ_CHANNEL); } catch(e) {}

    wz = { bookingId, currentStep:1, booking:null, answers:[], photos:[], draft:{} };

    showWzLoader('Loading inspection data & photos...');
    // Step 1: Load booking and draft first
    await loadWzBooking();
    await loadWzDraft();
    // Step 2: Merge fresh DB answers & photos over draft
    await loadWzAnswers();
    hideWzLoader();

    if (!wz.draft.categories || wz.draft.categories.length === 0) autoPopulateCategories();
    goToWzStep(wz.draft.currentStep || 1);
    startWzAutoSave();
    updateWzPreview();
}

function buildWizardShell() {
    const stepDots = WIZARD_STEPS.map(s =>
        `<div class="wz-step-dot" id="wz-dot-${s.id}" onclick="goToWzStep(${s.id})" title="${s.label}">` +
        `<i class="fas ${s.icon}"></i><span>${s.label}</span></div>`
    ).join('');
    return `
    <div id="wz-loader" class="wz-loader"><div class="wz-loader-spinner"></div><div id="wz-loader-text" style="color:var(--text-secondary);font-size:12px;">Loading...</div></div>
    <div class="wz-shell">
        <div class="wz-topbar">
            <div class="wz-topbar-left">
                <button class="wz-back-btn" onclick="if(wzAutoSaveTimer)clearInterval(wzAutoSaveTimer);window.location.hash='#/reports'"><i class="fas fa-arrow-left"></i> Back</button>
                <div><div class="wz-title" id="wz-title-text">Report Generator Wizard</div><div class="wz-subtitle" id="wz-subtitle-text">Loading...</div></div>
            </div>
            <div class="wz-topbar-actions">
                <div class="wz-autosave-badge" id="wz-autosave-badge" style="display:none;"><i class="fas fa-check-circle"></i> Saved</div>
                <button class="btn btn-secondary" onclick="wzSaveDraft()" style="font-size:11px;"><i class="fas fa-save"></i> Save</button>
                <button class="btn btn-secondary" onclick="wzOpenPreview()" style="font-size:11px;"><i class="fas fa-eye"></i> Preview</button>
                <button class="btn btn-primary" onclick="wzPublishReport()" style="font-size:11px;"><i class="fas fa-check"></i> Publish</button>
            </div>
        </div>
        <div class="wz-steps">${stepDots}</div>
        <div class="wz-body"><div class="wz-main" id="wz-main-content"></div></div>
        <div class="wz-nav-row">
            <button class="btn btn-secondary" id="wz-prev-btn" onclick="wzPrevStep()"><i class="fas fa-arrow-left"></i> Previous</button>
            <span style="font-size:11px;color:var(--text-secondary);" id="wz-step-indicator">Step 1 of 10</span>
            <button class="btn btn-primary" id="wz-next-btn" onclick="wzNextStep()">Next <i class="fas fa-arrow-right"></i></button>
        </div>
    </div>`;
}

// ── Data loaders ─────────────────────────────────────────────
async function loadWzBooking() {
    const client = dbClient || window.supabase;
    if (!client || !wz) return;
    try {
        const { data } = await client.from('bookings').select('*, profiles(full_name)').eq('id', wz.bookingId).single();
        if (data) {
            wz.booking = data;
            Object.assign(wz.draft, {
                booking_ref: data.booking_ref, customer_name: data.customer_name,
                customer_phone: data.customer_phone, vehicle_brand: data.vehicle_brand,
                vehicle_model: data.vehicle_model, vehicle_year: data.vehicle_year,
                vehicle_fuel: data.vehicle_fuel || 'Petrol', vehicle_reg: data.vehicle_reg,
                package_name: data.package_name, inspection_date: data.inspection_date,
                area: data.area, location_type: data.location_type,
                inspector_name: data.profiles?.full_name || '',
                ai_score: data.ai_score || '', verdict: data.verdict || '',
                odometer_km: data.odometer_km || '', owner_count: data.owner_count || '',
                vin_number: data.vin_number || '', color: data.color || '',
                body_type: data.body_type || '', engine_number: data.engine_number || '',
                chassis_number: data.chassis_number || '', reg_date: data.reg_date || '',
                rto_code: data.rto_code || '', insurance_expiry: data.insurance_expiry || '',
                puc_expiry: data.puc_expiry || '', tax_expiry: data.tax_expiry || '',
                admin_notes: data.admin_notes || '', recommendation: data.recommendation || '',
                inspector_notes: data.notes || ''
            });
            const titleEl = document.getElementById('wz-title-text');
            const subEl   = document.getElementById('wz-subtitle-text');
            if (titleEl) titleEl.textContent = 'Report: ' + data.booking_ref;
            if (subEl)   subEl.textContent   = (data.vehicle_brand||'') + ' ' + (data.vehicle_model||'') + ' · ' + data.customer_name;
        }
    } catch(e) { console.warn('loadWzBooking:', e); }
}

async function loadWzAnswers() {
    const client = dbClient || window.supabase;
    if (!client || !wz) return;
    try {
        const { data: answers, error: ansErr } = await client.from('inspection_answers').select('*').eq('booking_id', wz.bookingId).order('category');
        const { data: photos, error: photoErr }  = await client.from('inspection_photos').select('*').eq('booking_id', wz.bookingId);
        
        if (ansErr) console.warn("Error loading inspection_answers:", ansErr);
        if (photoErr) console.warn("Error loading inspection_photos:", photoErr);

        wz.answers = answers || [];
        wz.photos  = photos  || [];

        if (!wz.draft.checklist) wz.draft.checklist = {};

        // Merge DB answers into checklist
        (answers || []).forEach(ans => {
            if (!wz.draft.checklist[ans.category]) wz.draft.checklist[ans.category] = [];
            
            // Flexible matching on item_name
            let item = wz.draft.checklist[ans.category].find(i => 
                i.item_name && i.item_name.trim().toLowerCase() === ans.item_name.trim().toLowerCase()
            );

            // Match photos for this item
            const itemPhotos = (photos || []).filter(p => 
                p.item_name && p.item_name.trim().toLowerCase() === ans.item_name.trim().toLowerCase()
            ).map(p => p.photo_url);

            // Tyre-specific fields to carry over
            const tyreFields = {
                tyre_make: ans.tyre_make || '',
                tyre_model: ans.tyre_model || '',
                tyre_size: ans.tyre_size || '',
                mfg_week: ans.mfg_week || '',
                mfg_year: ans.mfg_year || '',
                tread_depth: ans.tread_depth || '',
                tread_condition: ans.tread_condition || '',
                sidewall_condition: ans.sidewall_condition || '',
                spare_condition: ans.spare_condition || ''
            };

            if (item) {
                // Update item with DB data from inspector
                if (ans.answer) item.answer = ans.answer;
                if (ans.severity) item.severity = ans.severity;
                if (ans.remarks) item.note = ans.remarks;
                if (ans.paint_thickness) item.paint_thickness = ans.paint_thickness;
                if (ans.obd_value) item.obd_value = ans.obd_value;
                // Merge tyre fields
                Object.keys(tyreFields).forEach(f => { if (tyreFields[f]) item[f] = tyreFields[f]; });
                if (itemPhotos.length > 0) {
                    item.photos = Array.from(new Set([...(item.photos || []), ...itemPhotos]));
                }
            } else {
                wz.draft.checklist[ans.category].push({
                    item_name: ans.item_name,
                    answer: ans.answer || 'Pass',
                    severity: ans.severity || 'low',
                    note: ans.remarks || '',
                    paint_thickness: ans.paint_thickness || '',
                    obd_value: ans.obd_value || '',
                    photos: itemPhotos,
                    ...tyreFields
                });
            }
        });

        // Ensure photos matched by category are also assigned if item match missed
        (photos || []).forEach(p => {
            if (p.category && wz.draft.checklist[p.category]) {
                const targetItem = wz.draft.checklist[p.category].find(i => 
                    i.item_name && p.item_name && i.item_name.trim().toLowerCase() === p.item_name.trim().toLowerCase()
                ) || wz.draft.checklist[p.category][0];

                if (targetItem) {
                    if (!targetItem.photos) targetItem.photos = [];
                    if (!targetItem.photos.includes(p.photo_url)) {
                        targetItem.photos.push(p.photo_url);
                    }
                }
            }
        });

        // Auto-populate hero exterior photos (fill any missing slots from inspector photos)
        autoPopulateHeroPhotos(photos || []);

        // Auto-calculate score if not set
        if (!wz.draft.ai_score && answers && answers.length > 0) {
            wzAutoCalcScore();
        }
    } catch(e) { console.warn('loadWzAnswers:', e); }
}

function autoPopulateHeroPhotos(photos) {
    if (!wz.draft.hero_photos) wz.draft.hero_photos = {};
    // First pass: prioritise Exterior Baseline Photo slots from inspector
    // item_name patterns: "Exterior Baseline Photos – Front View", "– Rear View", "– Left Side View", "– Right Side View"
    (photos || []).forEach(p => {
        const name = ((p.item_name || '') + ' ' + (p.caption || '')).toLowerCase();
        const isBaseline = name.includes('exterior baseline');
        if (isBaseline) {
            if (name.includes('front') && !wz.draft.hero_photos.front) {
                wz.draft.hero_photos.front = p.photo_url;
            } else if (name.includes('rear') && !wz.draft.hero_photos.rear) {
                wz.draft.hero_photos.rear = p.photo_url;
            } else if (name.includes('left') && !wz.draft.hero_photos.side_driver) {
                wz.draft.hero_photos.side_driver = p.photo_url;
            } else if (name.includes('right') && !wz.draft.hero_photos.side_passenger) {
                wz.draft.hero_photos.side_passenger = p.photo_url;
            }
        }
    });
    // Second pass: fall back to any photo with front/rear/left/right in name
    (photos || []).forEach(p => {
        const str = ((p.item_name || '') + ' ' + (p.caption || '')).toLowerCase();
        if (str.includes('front') && !wz.draft.hero_photos.front) {
            wz.draft.hero_photos.front = p.photo_url;
        } else if (str.includes('rear') && !wz.draft.hero_photos.rear) {
            wz.draft.hero_photos.rear = p.photo_url;
        } else if ((str.includes('driver') || str.includes('left')) && !wz.draft.hero_photos.side_driver) {
            wz.draft.hero_photos.side_driver = p.photo_url;
        } else if ((str.includes('passenger') || str.includes('right')) && !wz.draft.hero_photos.side_passenger) {
            wz.draft.hero_photos.side_passenger = p.photo_url;
        }
    });
}

async function loadWzDraft() {
    const client = dbClient || window.supabase;
    if (!client || !wz) return;
    try {
        const { data } = await client.from('report_drafts').select('*').eq('booking_id', wz.bookingId).single();
        if (data && data.draft_data) {
            wz.draft = Object.assign({}, wz.draft, data.draft_data);
            wz.draft.currentStep = data.current_step || 1;
        }
    } catch(e) {
        try {
            const raw = localStorage.getItem(WZ_LS_KEY + '_' + wz.bookingId);
            if (raw) wz.draft = Object.assign({}, wz.draft, JSON.parse(raw));
        } catch(e2) {}
    }
}

function getDefaultCatSummary(name, status) {
    const s = status || 'good';
    const defaults = {
        'Exterior': {
            good: 'Completely inspected body structure, panels, and paint finish. All alignment and panels are in healthy condition with detailed photos captured below.',
            attention: 'Minor cosmetic scratches or small dings observed on outer panels. Details and photos included in inspection report below.',
            critical: 'Body panel alignment issues or visible structural repair marks detected during exterior inspection.'
        },
        'Tyres': {
            good: 'All 4 tyres and spare wheel thoroughly inspected for tread depth, sidewall condition, and manufacturing date. In good roadworthy condition.',
            attention: 'Uneven tread wear or minor age-related sidewall micro-cracks detected. Inflation and tread details logged below.',
            critical: 'Low tread depth (<2mm) or sidewall damage detected on one or more tyres. Replacement recommended.'
        },
        'Brakes': {
            good: 'Brake pads, rotors, pedal travel, and handbrake efficiency tested. Operating smoothly with optimal stopping power.',
            attention: 'Moderate wear on brake pads or minor surface rust on brake discs noted during test.',
            critical: 'Worn out brake pads, spongy brake pedal response, or handbrake slippage observed.'
        },
        'Underbody': {
            good: 'Underbody and chassis frame inspected on lift. Floor pan, silencer, and lower crossmembers show no major rust or scraping.',
            attention: 'Minor surface oxidation or light underbody scraping observed on heat shields or lower floor guard.',
            critical: 'Significant underbody corrosion, structural bend, or active fluid seepage detected from undercarriage.'
        },
        'Engine Analysis': {
            good: 'Engine idle, sound, mounting vibration, oil quality, and coolant level thoroughly checked. Operates clean with no abnormal noise.',
            attention: 'Slight engine belt noise or minor oil sweat observed around valve cover gasket. No active leaks.',
            critical: 'Abnormal engine noise, heavy smoke, or active fluid leakage detected during engine run check.'
        },
        'Interior': {
            good: 'Seats, upholstery, dashboard console, switches, and seatbelts inspected. All cabin controls and trims in clean, functioning order.',
            attention: 'Minor wear on driver seat upholstery or slight scuff marks on inner door plastic trims.',
            critical: 'Damaged seat covers, non-functional power window, or missing cabin trim buttons noted.'
        },
        'Lighting': {
            good: 'Headlamps, high/low beam, tail lights, indicators, fog lamps, and cabin dome lights tested and operational.',
            attention: 'Minor condensation inside headlight lens or single bulb filament weak.',
            critical: 'Cracked light housing or non-functional main headlight / brake indicator.'
        },
        'AC': {
            good: 'Air conditioning compressor engagement, blower speed, vent airflow, and cooling temperature performance verified optimal.',
            attention: 'AC cooling takes slightly longer to chill cabin. Cabin air filter cleaning recommended.',
            critical: 'AC compressor failing to engage or insufficient cooling output detected.'
        },
        'Suspension': {
            good: 'Front struts, rear shock absorbers, bush arm condition, and driveability tested. No thudding noise over bumps.',
            attention: 'Slight stiffness or minor rubber bush aging observed on front lower suspension arms.',
            critical: 'Leaking shock absorber or prominent clunking sound over uneven surfaces.'
        },
        'Gear & Transmission': {
            good: 'Clutch pedal play, gear shift smoothness, clutch engagement point, and drive transmission checked. Smooth gear transitions.',
            attention: 'Clutch pedal travel slightly firm or minor stiffness during gear engagement when cold.',
            critical: 'Clutch slipping or harsh gear shift jerks / transmission noise detected during test drive.'
        },
        'Inspection Info': {
            good: 'Comprehensive 300+ point inspection conducted at doorstep/yard by certified technician with full photo verification.',
            attention: 'Inspection completed with limited access to highway speed test drive due to traffic/yard constraints.',
            critical: 'Partial inspection completed due to vehicle non-start or battery discharge.'
        },
        'Vahan Info': {
            good: 'RC details, owner history, registration validity, engine & chassis number match verified with official database.',
            attention: 'RC particulars verified; insurance / PUC certificate renewal recommended.',
            critical: 'Discrepancy noted in vehicle registration date or owner count vs document records.'
        }
    };
    const match = defaults[name];
    if (match) return match[s] || match.good;
    return s === 'good' ? 'Inspected and verified in healthy functioning condition.' : 'Minor observations noted during inspection.';
}

function autoPopulateCategories() {
    if (!wz) return;
    const catNames = ['Exterior','Tyres','Brakes','Underbody','Engine Analysis','Interior','Lighting','AC','Suspension','Gear & Transmission','Inspection Info','Vahan Info'];
    const answers = wz.answers || [];
    wz.draft.categories = catNames.map(name => {
        const rel = answers.filter(a => a.category && a.category.toLowerCase().includes(name.split(' ')[0].toLowerCase()));
        const failCt = rel.filter(a => a.answer === 'Fail' || a.severity === 'high').length;
        const warnCt = rel.filter(a => a.severity === 'medium' || ['Scratch','Dent','Rust','Worn'].includes(a.answer)).length;
        const status = failCt > 0 ? 'critical' : warnCt > 0 ? 'attention' : 'good';
        return { name, status, description: getDefaultCatSummary(name, status), _isAutoDesc: true };
    });
}

// ── Navigation ───────────────────────────────────────────────
function goToWzStep(step) {
    if (!wz) return;
    const n = Math.max(1, Math.min(10, step));
    wz.currentStep = n;
    if (wz.draft) wz.draft.currentStep = n;
    document.querySelectorAll('.wz-step-dot').forEach((el, i) => {
        el.classList.remove('active','done');
        if (i+1 === n) el.classList.add('active');
        else if (i+1 < n) el.classList.add('done');
    });
    const ind = document.getElementById('wz-step-indicator');
    if (ind) ind.textContent = 'Step ' + n + ' of 10';
    const prevBtn = document.getElementById('wz-prev-btn');
    const nextBtn = document.getElementById('wz-next-btn');
    if (prevBtn) prevBtn.style.display = n === 1 ? 'none' : '';
    if (nextBtn) nextBtn.innerHTML = n === 10 ? '<i class="fas fa-check"></i> Finish' : 'Next <i class="fas fa-arrow-right"></i>';
    const main = document.getElementById('wz-main-content');
    if (main) { main.innerHTML = buildWzStep(n); bindWzStepScroll(n); }
    updateWzPreview();
}
window.goToWzStep = goToWzStep;
window.wzNextStep = () => goToWzStep((wz?.currentStep||1) + 1);
window.wzPrevStep = () => goToWzStep((wz?.currentStep||1) - 1);

function bindWzStepScroll(n) {
    // Re-scroll to top of main content on step change
    const main = document.getElementById('wz-main-content');
    if (main) main.scrollTop = 0;
}

// ── Step builders ─────────────────────────────────────────────
function buildWzStep(n) {
    switch(n) {
        case 1:  return buildStep1();
        case 2:  return buildStep2();
        case 3:  return buildStep3();
        case 4:  return buildStep4();
        case 5:  return buildStep5();
        case 6:  return buildStep6();
        case 7:  return buildStep7();
        case 8:  return buildStep8();
        case 9:  return buildStep9();
        case 10: return buildStep10();
        default: return '<p>Unknown step</p>';
    }
}

// Helper render functions
function wzFi(id, label, val, type, ph) {
    type = type || 'text'; ph = ph || '';
    return '<div class="wz-field"><label>' + label + '</label>' +
        '<input type="' + type + '" id="' + id + '" value="' + escW(val) + '" placeholder="' + ph + '" oninput="wzFieldChange(\'' + id + '\')"></div>';
}
function wzFta(id, label, val, rows) {
    rows = rows || 3;
    return '<div class="wz-field wz-field-full"><label>' + label + '</label>' +
        '<textarea id="' + id + '" rows="' + rows + '" oninput="wzFieldChange(\'' + id + '\')">' + escW(val) + '</textarea></div>';
}
function wzFsel(id, label, val, options) {
    const opts = options.map(function(o) {
        if (typeof o === 'string') return '<option value="' + o + '"' + (val===o?' selected':'') + '>' + o + '</option>';
        return '<option value="' + o.v + '"' + (val===o.v?' selected':'') + '>' + o.l + '</option>';
    }).join('');
    return '<div class="wz-field"><label>' + label + '</label><select id="' + id + '" onchange="wzFieldChange(\'' + id + '\')">' + opts + '</select></div>';
}
function escW(s) { return s==null?'':String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function buildStep3() {
    const d = wz.draft;
    const checklist = d.checklist || {};
    const allCats = Object.keys(checklist);
    if (allCats.length === 0) {
        return '<div class="wz-step-header"><div class="wz-step-title">🔧 Technical Inspection</div></div>' +
            '<div class="wz-card"><p style="color:var(--text-secondary);font-size:13px;">No checklist data found. The inspector may not have submitted yet, or the data table names may differ from expected (<b>inspection_answers</b>).</p></div>';
    }
    return '<div class="wz-step-header"><div class="wz-step-title">🔧 Technical Checkpoints</div>' +
        '<div class="wz-step-desc">Review and edit every checklist item submitted by the inspector. Click a category to expand it.</div></div>' +
        allCats.map(function(cat) {
            const items = checklist[cat] || [];
            const isTyreCat = cat.toLowerCase().includes('tyre data');
            const itemRows = items.map(function(item, ii) {
                // Status options aligned with Inspector App
                const statusOpts = ['Pass','Warn','Fail','N/A'].map(function(s) {
                    return '<option value="' + s + '"' + (item.answer===s?' selected':'') + '>' + s + '</option>';
                }).join('');

                    return '<option value="' + s + '"' + (item.severity===s?' selected':'') + '>' + s + '</option>';
                }).join('');
                const photosHtml = (item.photos && item.photos.length) ?
                    '<div class="wz-photo-grid">' + item.photos.map(function(p, pi) {

                    }).join('') + '</div>' : '';

                        (item.tyre_make ? '<span style="font-size:10px;background:rgba(245,158,11,0.15);color:#f59e0b;padding:2px 6px;border-radius:4px;">🛞 ' + escW(item.tyre_make) + ' ' + escW(item.tyre_model||'') + '</span>' : '') +
                        (item.tyre_size ? '<span style="font-size:10px;color:#9ca3af;">Size: ' + escW(item.tyre_size) + '</span>' : '') +
                        (item.mfg_week && item.mfg_year ? '<span style="font-size:10px;color:#9ca3af;">DOT: W' + escW(item.mfg_week) + '/' + escW(item.mfg_year) + '</span>' : '') +
                        (item.tread_depth ? '<span style="font-size:10px;color:#9ca3af;">Tread: ' + escW(item.tread_depth) + 'mm</span>' : '') +
                        (item.tread_condition ? '<span style="font-size:10px;color:#fbbf24;">' + escW(item.tread_condition) + '</span>' : '') +

                    '</label>';

function buildStep4() {
    const d = wz.draft;
    // Auto-populate tyre data from inspector checklist if not already set
    const checklist = d.checklist || {};
    const tyreCatKey = Object.keys(checklist).find(k => k.toLowerCase().includes('tyre data'));
    if (tyreCatKey && (!d.tyre_data || Object.values(d.tyre_data).every(t => !t || Object.keys(t).length === 0))) {
        const items = checklist[tyreCatKey] || [];
        if (!d.tyre_data) d.tyre_data = { fl:{}, fr:{}, rl:{}, rr:{}, spare:{} };
        const posMap = { fl: 'front left', fr: 'front right', rl: 'rear left', rr: 'rear right', spare: 'spare' };
        const tyreFields = ['tyre_make','tyre_model','tyre_size','mfg_week','mfg_year','tread_depth','tread_condition','sidewall_condition','spare_condition'];
        Object.keys(posMap).forEach(function(posKey) {
            const label = posMap[posKey];
            const match = items.find(function(i) { return i.item_name && i.item_name.toLowerCase().includes(label); });
            if (match) {
                tyreFields.forEach(function(f) { if (match[f]) d.tyre_data[posKey][f] = match[f]; });
            }
        });
    }
    const cats = d.categories || [];
    const catsHtml = cats.map(function(c, i) {
        if (!c.description) {
            c.description = getDefaultCatSummary(c.name, c.status);
            c._isAutoDesc = true;
        }
        const statusOpts = [{v:'good',l:'🟢 Good'},{v:'attention',l:'Attention'},{v:'critical',l:'🔴 Critical'}].map(function(o) {
            return '<option value="' + o.v + '"' + (c.status===o.v?' selected':'') + '>' + o.l + '</option>';
        }).join('');
        return '<div class="wz-cat-card"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">' +
            '<div style="font-weight:700;font-size:13px;">' + escW(c.name) + '</div>' +
            '<select class="wz-status-select" onchange="wzUpdateCategory(' + i + ',\'status\',this.value)">' + statusOpts + '</select>' +
            '</div>' +
            '<input type="text" placeholder="Category summary (e.g. No issues found...)" value="' + escW(c.description||'') + '" oninput="wzUpdateCategory(' + i + ',\'description\',this.value)" style="width:100%;background:var(--bg-color);border:1px solid var(--border-color);color:var(--text-primary);padding:7px 11px;border-radius:8px;font-size:12px;font-family:inherit;">' +
            '</div>';
    }).join('');
    return '<div class="wz-step-header"><div class="wz-step-title">📊 Scoring &amp; Category Health</div>' +
        '<div class="wz-step-desc">Set each category\'s health status and add negotiation suggestions.</div></div>' +
        '<div class="wz-card"><div class="wz-card-title">Negotiation Suggestions ' +
        '<button class="wz-api-btn" onclick="wzAutoGenNegotiations()"><i class="fas fa-magic"></i> Auto-Generate</button></div>' +
        '<table class="wz-table"><thead><tr><th>Issue</th><th>Description</th><th>Amount (₹)</th><th></th></tr></thead>' +
        '<tbody id="neg-table-body">' + buildNegRows() + '</tbody></table>' +
        '<button class="wz-add-row-btn" onclick="wzAddNegRow()">+ Add Negotiation Item</button></div>' +
        '<div class="wz-card"><div class="wz-card-title">12-Category Health Breakdown</div>' +
        (catsHtml || '<p style="color:var(--text-secondary);">No categories loaded.</p>') + '</div>' +
        buildTyreDataCard();

            return '<option value="' + o + '"' + (t.tread_condition===o?' selected':'') + '>' + (o||'Select...') + '</option>';

window.wzFieldChange = function(inputId) {
    if (!wz || !wz.draft) return;
    const el = document.getElementById(inputId);
    if (!el) return;
    const key = WZ_FIELD_MAP[inputId];
    if (key) {
        const old = wz.draft[key];
        wz.draft[key] = el.value;
        wzLogAudit(key, old, el.value);
    }
    updateWzPreview();
};

window.wzSetVerdict = function(v) {
    if (!wz || !wz.draft) return;
    wz.draft.verdict = v;
    document.querySelectorAll('.wz-verdict-opt').forEach(function(el) { el.classList.remove('selected'); });
    const id = 'vopt-' + v.replace(/[^a-zA-Z0-9]/g,'_');
    const opt = document.getElementById(id);
    if (opt) opt.classList.add('selected');
    updateWzPreview();
};

window.wzUpdateCategory = function(idx, field, val) {
    if (!wz || !wz.draft || !wz.draft.categories || !wz.draft.categories[idx]) return;
    const cat = wz.draft.categories[idx];
    cat[field] = val;
    if (field === 'status' && (!cat.description || cat._isAutoDesc)) {
        cat.description = getDefaultCatSummary(cat.name, val);
        cat._isAutoDesc = true;
        goToWzStep(4);
        return;
    }
    if (field === 'description') {
        cat._isAutoDesc = false;
    }
    updateWzPreview();
};

    if (!wz || !wz.draft) return;
    if (!wz.draft.tyre_data) wz.draft.tyre_data = { fl:{}, fr:{}, rl:{}, rr:{}, spare:{} };
    const fl = wz.draft.tyre_data.fl || {};
    const fields = ['tyre_make', 'tyre_model', 'tyre_size', 'mfg_week', 'mfg_year', 'tread_depth', 'tread_condition', 'sidewall_condition', 'note'];
    ['fr', 'rl', 'rr'].forEach(function(targetPos) {
        if (!wz.draft.tyre_data[targetPos]) wz.draft.tyre_data[targetPos] = {};
        fields.forEach(function(f) {
            if (fl[f] !== undefined && fl[f] !== '') {
                wz.draft.tyre_data[targetPos][f] = fl[f];
            }
        });
    });
    goToWzStep(4);
    updateWzPreview();
    showToast('Copied Front Left tyre specs to all 4 tyres (Spare untouched)', 'success');
};

// Auto-load tyre data from inspector submissions (Tyre Data category)
window.wzAutoLoadTyreData = function() {
    if (!wz || !wz.draft) return;
    const checklist = wz.draft.checklist || {};
    const tyreCategory = Object.keys(checklist).find(k => k.toLowerCase().includes('tyre data'));
    if (!tyreCategory) {
        showToast('No Tyre Data found from inspector yet.', 'error');
        return;
    }
    const items = checklist[tyreCategory] || [];
    if (!wz.draft.tyre_data) wz.draft.tyre_data = { fl:{}, fr:{}, rl:{}, rr:{}, spare:{} };
    const posMap = { fl: 'Front Left', fr: 'Front Right', rl: 'Rear Left', rr: 'Rear Right', spare: 'Spare' };
    let loaded = 0;
    Object.keys(posMap).forEach(function(posKey) {
        const label = posMap[posKey];
        const match = items.find(function(i) { return i.item_name && i.item_name.toLowerCase().includes(label.toLowerCase()); });
        if (match) {

{
  "summary": "2-3 sentences executive summary of the service history (mention total visits, date range, mileage range, total spend if present, and maintenance status).",
  "records": [
    {
      "service_date": "YYYY-MM-DD",

      "odometer_km": 93208,
      "service_type": "free service | paid service | running repair | periodic | accidental | warranty",

    }
  ]

window.wzExtractPdfText = function(file) {
    return new Promise(function(resolve, reject) {
        var reader = new FileReader();
        reader.onload = function(e) {
            var typedArray = new Uint8Array(e.target.result);
            pdfjsLib.getDocument({ data: typedArray }).promise.then(function(pdf) {
                var total = pdf.numPages;
                var pagePromises = [];
                for (var p = 1; p <= total; p++) {
                    pagePromises.push(pdf.getPage(p).then(function(page) {
                        return page.getTextContent().then(function(content) {
                            // Sort items by Y (top to bottom), then X (left to right)
                            var items = (content.items || []).slice().sort(function(a, b) {
                                var yA = a.transform ? a.transform[5] : 0;
                                var yB = b.transform ? b.transform[5] : 0;
                                if (Math.abs(yA - yB) > 4) return yB - yA; // top to bottom
                                var xA = a.transform ? a.transform[4] : 0;
                                var xB = b.transform ? b.transform[4] : 0;
                                return xA - xB; // left to right
                            });

                            var pageLines = [];
                            var currentLine = [];
                            var lastY = null;

                            items.forEach(function(item) {
                                var str = (item.str || '').trim();
                                if (!str) return;
                                var y = item.transform ? item.transform[5] : 0;
                                if (lastY !== null && Math.abs(y - lastY) > 4) {
                                    pageLines.push(currentLine.join(' '));
                                    currentLine = [];
                                }
                                currentLine.push(str);
                                lastY = y;
                            });
                            if (currentLine.length > 0) {
                                pageLines.push(currentLine.join(' '));
                            }
                            return pageLines.join('\n');
                        });
                    }));
                }
                Promise.all(pagePromises).then(function(pagesText) {
                    resolve(pagesText.join('\n'));
                }).catch(reject);
            }).catch(reject);
        };
        reader.onerror = reject;
        reader.readAsArrayBuffer(file);
    });
};

window.wzParseSvcRecords = function(rawText) {
    var lines = rawText.split('\n').map(function(l) { return l.trim(); }).filter(Boolean);
    var records = [];

    // ── Month name → number ──────────────────────────────────
    var MON = {
        jan:'01',feb:'02',mar:'03',apr:'04',may:'05',jun:'06',
        jul:'07',aug:'08',sep:'09',oct:'10',nov:'11',dec:'12'
    };

    // ── Normalize date string → YYYY-MM-DD ───────────────
    function normDate(raw) {
        raw = (raw || '').trim().replace(/\s+\d{1,2}:\d{2}.*$/, '').trim();
        // DD-MON-YYYY  e.g. 10-JUN-2026
        var m = raw.match(/^(\d{1,2})[-\/]([A-Za-z]{3,})[-\/](\d{2,4})$/);
        if (m) {
            var mo = MON[m[2].toLowerCase().substring(0,3)] || '01';
            var yr = m[3].length === 2 ? '20' + m[3] : m[3];
            return yr + '-' + mo + '-' + m[1].padStart(2,'0');
        }
        // YYYY-MM-DD
        m = raw.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/);
        if (m) return m[1] + '-' + m[2].padStart(2,'0') + '-' + m[3].padStart(2,'0');
        // DD/MM/YYYY or DD-MM-YYYY
        m = raw.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})$/);
        if (m) {
            var yr2 = m[3].length === 2 ? '20' + m[3] : m[3];
            return yr2 + '-' + m[2].padStart(2,'0') + '-' + m[1].padStart(2,'0');
        }
        // DD Mon YYYY
        m = raw.match(/^(\d{1,2})\s+([A-Za-z]{3,})[,\s]+(\d{4})$/);
        if (m) {
            var mo2 = MON[m[2].toLowerCase().substring(0,3)] || '01';
            return m[3] + '-' + mo2 + '-' + m[1].padStart(2,'0');
        }
        return '';
    }

    // ── Service type classifier ────────────────────────────────
    var SVC_MAP = [
        [/1st\s*free\s*service|first\s*free\s*service/i,   'free service'],
        [/2nd\s*free\s*service|second\s*free\s*service/i,  'free service'],
        [/3rd\s*free\s*service|third\s*free\s*service/i,   'free service'],
        [/\d+th\s*free\s*service/i,                        'free service'],
        [/free\s*service|fsc/i,                            'free service'],
        [/service\s*camp/i,                                'dealer'],
        [/running\s*repair/i,                              'dealer'],
        [/m\.o\.s\.|mos\b/i,                               'dealer'],
        [/paid\s*service/i,                                'dealer'],
        [/periodic\s*service|scheduled\s*service/i,        'periodic'],
        [/accidental|accident|collision|body\s*repair/i,   'accidental'],
        [/warranty|recall|campaign/i,                      'warranty'],
        [/general\s*service|annual\s*service/i,            'dealer'],
        [/oil\s*change|engine\s*oil/i,                     'dealer'],
    ];
    function classifySvc(text) {
        for (var k = 0; k < SVC_MAP.length; k++) {
            if (SVC_MAP[k][0].test(text)) return SVC_MAP[k][1];
        }
        return 'dealer';
    }

    // ── Extract readable service label for description field ──
    var SVC_LABELS = [
        /(\d+(?:st|nd|rd|th)\s+free\s+service)/i,
        /(free\s+service)/i,
        /(service\s+camp)/i,
        /(running\s+repair)/i,
        /(m\.o\.s\.)/i,
        /(paid\s+service)/i,
        /(periodic\s+service)/i,
        /(general\s+service)/i,
        /(annual\s+service)/i,
    ];
    function extractSvcLabel(text) {
        for (var p = 0; p < SVC_LABELS.length; p++) {
            var sl = text.match(SVC_LABELS[p]);
            if (sl) return sl[1].trim().toUpperCase();
        }
        return '';
    }

    // Extract global dealer/make if available at top of PDF
    var globalDealer = '';
    var makeMatch = rawText.match(/Make[:\s]+([A-Za-z0-9]+)/i);
    if (makeMatch) globalDealer = makeMatch[1].trim() + ' Authorized Service';

    // ── Process line by line ──────────────────────────────────
    var seen = {};

    for (var i = 0; i < lines.length; i++) {
        var line = lines[i];

        // Skip lines that are purely headers (must NOT contain a date)
        var isHeaderOnly = /visit\s*no|workshop\s*visit|odometer\s*reading|service\s*type/i.test(line) &&
                           !/(\d{1,2}[\s\-\/][A-Za-z]{3,}[\s\-\/]\d{2,4}|\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4})/i.test(line);
        if (isHeaderOnly) continue;

        // Find date in this line
        var dateRaw = '';
        var matchSpace = line.match(/\b(\d{1,2}\s+(?:JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)[a-z]*\s+\d{2,4})\b/i);
        var matchA = line.match(/(\d{1,2}[-\/](?:JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)[-\/]\d{2,4})(?:\s+\d{1,2}:\d{2})?/i);
        if (matchSpace) {
            dateRaw = matchSpace[1];
        } else if (matchA) {
            dateRaw = matchA[1];
        } else {
            var matchB = line.match(/\b(\d{1,2}[\/\-]\d{1,2}[\/\-]\d{4})\b/);
            if (matchB) dateRaw = matchB[1];
            else {
                var matchC = line.match(/\b(\d{4}-\d{2}-\d{2})\b/);
                if (matchC) dateRaw = matchC[1];
            }
        }

        if (!dateRaw) continue;

        var dateISO = normDate(dateRaw);
        if (!dateISO) continue;

        // Deduplicate by date
        if (seen[dateISO]) continue;
        seen[dateISO] = true;

        // Context window: current line + next line
        var ctx = lines.slice(i, Math.min(lines.length, i + 2)).join(' ');

        // ── Odometer: match NUMBER km ──────
        var odo = '';
        var odoM = ctx.match(/\b([0-9,]{3,7})\s*km\b/i);
        if (odoM) {
            odo = odoM[1].replace(/,/g, '');
        } else {
            var odoP = ctx.match(/(?:odometer|mileage|reading)[:\s]+([0-9,]+)/i);
            if (odoP) odo = odoP[1].replace(/,/g, '');
        }

        // ── Service label & type ──────────────────────────────
        var svcLabel = extractSvcLabel(ctx);
        var svcType  = classifySvc(ctx);

        // ── Cost (only if explicitly stated per row) ──────────
        var cost = '';
        var costM = ctx.match(/(?:amount|cost|charge)[:\s]+(?:rs\.?\s*|₹\s*)?([0-9,]+(?:\.[0-9]{1,2})?)/i);
        if (costM) cost = costM[1].replace(/,/g, '');

        // ── Dealer name ───────────────────────────────────────
        var dealer = globalDealer;
        var dealerM = ctx.match(/(?:dealer(?:ship)?|workshop|service\s+cent(?:er|re))[:\s]+([A-Za-z0-9\s&.,']{3,35})/i);
        if (dealerM) dealer = dealerM[1].trim();

        records.push({
            service_date: dateISO,
            odometer_km:  odo,
            service_type: svcType,
            dealer_name:  dealer,
            description:  svcLabel,
            cost:         cost
        });
    }

    return records;
};

function compressWzImage(dataUrl, maxW, maxH, quality) {
    return new Promise(function(resolve) {
        var img = new Image();
        img.onload = function() {
            var canvas = document.createElement('canvas');
            var w = img.width, h = img.height;
            if (w > maxW) { h = h * maxW / w; w = maxW; }
            if (h > maxH) { w = w * maxH / h; h = maxH; }
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = dataUrl;
    });
}

window.wzAutoCalcScore = function() {
    if (!wz || !wz.draft || !wz.draft.checklist) return;

    var fails = allItems.filter(function(i){return i.answer==='Fail'||i.severity==='high';}).length;

    var score = Math.min(100, Math.max(0, Math.round(100 - (fails*8) - (warns*3))));
    wz.draft.ai_score = score;
    var el = document.getElementById('wf-ai-score');
    if (el) el.value = score;
    var verdict = score >= 80 ? 'Excellent · Buy' : score >= 65 ? 'Good · Minor Repairs' : score >= 50 ? 'Fair · Price Cut Needed' : 'Poor · Avoid';
    wzSetVerdict(verdict);
    showToast('Score auto-calculated: ' + score + '/100', 'success');
};

async function callGeminiAI(prompt) {
    if (!GEMINI_API_KEY) throw new Error("Gemini API key is missing");
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${GEMINI_API_KEY}`;
    const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
        })
    });
    if (!res.ok) {
        const txt = await res.text();
        throw new Error(`Gemini API error (${res.status}): ${txt}`);
    }
    const data = await res.json();
    if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts[0]) {
        return data.candidates[0].content.parts[0].text;
    }
    throw new Error("No output generated from Gemini AI");
}

        const jsonText = await callGeminiAI(prompt);

        const res = JSON.parse(cleanJson);
        
        if (res.market_price_analysis) d.market_price_analysis = res.market_price_analysis;
        if (res.engine_calibration) d.engine_calibration = res.engine_calibration;
        if (res.tyre_analysis_text) d.tyre_analysis_text = res.tyre_analysis_text;
        if (res.summary) d.summary = res.summary;
        if (res.recommendation) d.recommendation = res.recommendation;
        
        goToWzStep(8);
        showToast('✨ Gemini AI generated Market Price Analysis & Remarks!', 'success');
    } catch(err) {
        console.error("Gemini AI error:", err);
        showToast('AI Generation failed: ' + err.message, 'error');
    }
};

window.wzAutoGenNegotiations = async function() {
    if (!wz || !wz.draft || !wz.draft.checklist) return;
    const d = wz.draft;
    showToast('🤖 Gemini AI analyzing inspection findings for price negotiations...', 'info');

    const failedItems = [];
    Object.keys(d.checklist).forEach(cat => {
        d.checklist[cat].filter(i => i.answer === 'Fail' || i.severity === 'high' || i.severity === 'medium').forEach(item => {
            failedItems.push(`${cat}: ${item.item_name} (${item.note || item.answer})`);
        });
    });

    if (failedItems.length > 0) {
        const prompt = `You are a used car price negotiator in India.
Vehicle: ${d.vehicle_year || ''} ${d.vehicle_brand || ''} ${d.vehicle_model || ''}
Identified Issues/Defects:
${failedItems.slice(0, 10).join('\n')}

Generate 2 to 4 price negotiation items with realistic price cuts in INR (₹) that the buyer can request from the seller.
Return ONLY valid JSON array:
[
  { "issue": "Short Title", "description": "1 sentence explanation", "amount": 4000 }
]`;

        try {
            const jsonText = await callGeminiAI(prompt);
            const cleanJson = jsonText.replace(/```json\s*|\s*```/g, '').trim();
            const negs = JSON.parse(cleanJson);
            if (Array.isArray(negs) && negs.length > 0) {
                d.negotiations = negs;
                goToWzStep(4);
                showToast(`✨ Generated ${negs.length} AI negotiation suggestions!`, 'success');
                return;
            }
        } catch(e) {
            console.warn("AI Negotiation fallback:", e);
        }
    }

    // Fallback rule-based generation
    var negs = [];
    Object.keys(d.checklist).forEach(function(cat) {
        var fails = d.checklist[cat].filter(function(i){return i.answer==='Fail'||i.severity==='high';});
        if (fails.length > 0) {
            negs.push({ issue: cat + ' — ' + fails.slice(0,2).map(function(f){return f.item_name;}).join(', '), description: fails.length + ' item(s) require attention.', amount: fails.length * 3000 });
        }
    });
    if (negs.length === 0) {
        negs = [
            { issue: 'General Secondhand Market Negotiation', description: 'Standard margin for upcoming annual service and fluid refresh.', amount: 5000 },
            { issue: 'Minor Paint Touchup & Detailing', description: 'Budget for minor bumper paint touchup and interior deep cleaning.', amount: 3500 }
        ];
    }
    d.negotiations = negs;
    goToWzStep(4);
    showToast(negs.length + ' negotiation suggestions generated', 'success');
};

window.wzAutoGenRepairs = function() {
    if (!wz || !wz.draft || !wz.draft.checklist) return;
    var repairs = [];
    Object.keys(wz.draft.checklist).forEach(function(cat) {
        wz.draft.checklist[cat].filter(function(i){return i.answer==='Fail'||i.severity==='high';}).forEach(function(item) {
            repairs.push({ category: cat.split(' ')[0], component: item.item_name, description: item.note||'Requires attention', severity: item.severity||'medium', est_cost_min: 1500, est_cost_max: 5000 });
        });
    });
    wz.draft.repairs = repairs;
    goToWzStep(7);
    showToast(repairs.length + ' repair items generated', 'success');
};

// ── Live preview sync ─────────────────────────────────────────
function updateWzPreview() {
    if (!wz || !wz.draft) return;
    var payload = buildPreviewPayload();
    try {
        localStorage.setItem(WZ_LS_KEY, JSON.stringify(payload));
        if (wzBroadcastChannel) wzBroadcastChannel.postMessage({ type: 'REPORT_UPDATE', payload: payload });
    } catch(e) {}
    if (wz.currentStep === 9) {
        var frame = document.getElementById('wz-preview-frame');
        if (frame) {
            try { if (frame.contentWindow && frame.contentWindow.renderReport) frame.contentWindow.renderReport(payload); } catch(e) {}
        }
    }
}

function buildPreviewPayload() {
    var d = (wz && wz.draft) ? wz.draft : {};
    return {
        booking_ref:d.booking_ref, customer_name:d.customer_name,
        vehicle_brand:d.vehicle_brand, vehicle_model:d.vehicle_model, vehicle_year:d.vehicle_year,
        vehicle_fuel:d.vehicle_fuel, vehicle_reg:d.vehicle_reg, vin_number:d.vin_number,
        engine_number:d.engine_number, chassis_number:d.chassis_number, color:d.color,
        body_type:d.body_type, odometer_km:d.odometer_km, owner_count:d.owner_count,
        rto_code:d.rto_code, reg_date:d.reg_date, insurance_expiry:d.insurance_expiry,
        puc_expiry:d.puc_expiry, tax_expiry:d.tax_expiry, ai_score:d.ai_score,
        verdict:d.verdict, recommendation:d.recommendation, summary:d.summary,
        inspection_date:d.inspection_date, completed_date:d.completed_date,
        package_name:d.package_name, area:d.area, location_type:d.location_type,
        inspector_name:d.inspector_name, inspector_notes:d.inspector_notes,
        admin_remarks:d.admin_remarks, engine_calibration:d.engine_calibration,
        tyre_analysis_text:d.tyre_analysis_text, service_history_note:d.service_history_note,
        market_price_analysis:d.market_price_analysis, categories:d.categories||[],
        negotiations:d.negotiations||[], repairs:d.repairs||[],
        service_history:d.service_history||[], documents:d.documents||[],
        hero_photos:d.hero_photos||{}, checklist:d.checklist||{},
        tyre_data:d.tyre_data||{}, tyre_summary:d.tyre_summary||''
    };
}

// ── Save Draft ────────────────────────────────────────────────
window.wzSaveDraft = async function() {
    if (!wz) return;
    try {
        var client = dbClient || window.supabase;
        var payload = { booking_id: wz.bookingId, draft_data: wz.draft, current_step: wz.currentStep, last_saved: new Date().toISOString() };
        if (client) await client.from('report_drafts').upsert(payload, { onConflict: 'booking_id' });
        localStorage.setItem(WZ_LS_KEY + '_' + wz.bookingId, JSON.stringify(wz.draft));
        var badge = document.getElementById('wz-autosave-badge');
        if (badge) { badge.style.display = 'flex'; setTimeout(function(){badge.style.display='none';}, 3000); }
        showToast('Draft saved!', 'success');
    } catch(e) { showToast('Save failed: ' + e.message, 'error'); }
};

function startWzAutoSave() {
    if (wzAutoSaveTimer) clearInterval(wzAutoSaveTimer);
    wzAutoSaveTimer = setInterval(async function() { if (wz) await wzSaveDraft(); }, 30000);
}

// ── Publish ───────────────────────────────────────────────────
window.wzPublishReport = async function() {
    if (!wz) return;
    if (!confirm('Publish this report? This will mark the booking as report_published and create a version snapshot.')) return;
    try {
        showWzLoader('Publishing report...');
        var client = dbClient || window.supabase;
        var payload = buildPreviewPayload();
        await wzSaveDraft();
        if (client) {
            var { data: versions } = await client.from('report_versions').select('version_number').eq('booking_id', wz.bookingId).order('version_number', { ascending: false }).limit(1);
            var nextVersion = ((versions && versions[0] ? versions[0].version_number : 0) || 0) + 1;
            await client.from('report_versions').insert({ booking_id: wz.bookingId, version_number: nextVersion, report_data: payload, published_by: (state && state.profile ? state.profile.full_name : 'Admin'), notes: 'Version ' + nextVersion + ' published' });
            await client.from('bookings').update({ report_status: 'report_published', ai_score: payload.ai_score, verdict: payload.verdict }).eq('id', wz.bookingId);
            await client.from('report_audit_log').insert({ booking_id: wz.bookingId, action: 'publish', admin_email: (state && state.user ? state.user.email : ''), field_path: 'report', new_value: 'Version ' + nextVersion + ' published' });
        }
        hideWzLoader();
        showToast('Report published successfully!', 'success');
    } catch(e) { hideWzLoader(); showToast('Publish failed: ' + e.message, 'error'); }
};

// ── Audit log ─────────────────────────────────────────────────
function wzLogAudit(field, oldVal, newVal) {
    if (!wz || !wz.draft) return;
    if (!wz.draft.audit_log) wz.draft.audit_log = [];
    wz.draft.audit_log.push({ ts: new Date().toISOString(), field: field, old: String(oldVal||''), new: String(newVal||'') });
}

// ── UI helpers ────────────────────────────────────────────────
function showWzLoader(msg) {
    var el = document.getElementById('wz-loader');
    var txt = document.getElementById('wz-loader-text');
    if (el) el.classList.add('visible');
    if (txt) txt.textContent = msg || 'Loading...';
}
function hideWzLoader() {
    var el = document.getElementById('wz-loader');
    if (el) el.classList.remove('visible');
}
